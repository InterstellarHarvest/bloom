<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOOM</title>
<!--
  BLOOM — player entry point (BLOOM-016). Home → planet → scenario → briefing, then the run page
  (demos/demo-run.html?play=1&archetype=…&scenario=…), which prepares the world (bounded World Seed search through the real
  production path), plays it, and offers Play again / Same planet, new world / Change scenario / Change planet afterwards.
  First Bloom starts directly (demos/demo-run.html?play=1), exactly as the accepted authored run.

  A clean temporary shell, NOT the final UI: layout, typography, icons and art are decided later, after the PMO / owner
  design-reference review (docs/VISUAL_DIRECTION_v1.0.md §10). All copy comes from data: content/play.js (flow),
  content/archetypes.js `display` (planet cards), content/scenarios.js `display.card` (scenario cards).
  This page never validates anything: the planet cards' mini maps are raw terrain from BLOOM.archetype.attemptPlanet
  (generation only). Validation starts on the run page, for the chosen combination only.
  Screens are hash routes so Back / Forward work: #/ · #/planet[/<planet>] · #/scenario/<planet> · #/brief/<planet>/<scenario>
  Boots over file://. Developer launches (demos/demo-run.html?archetype=…&seed=…&scenario=…) are unchanged.
-->
<style>
  :root{
    --bg:#0b0e14; --panel:#121826; --panel2:#0e1320; --ink:#dfe6f2; --dim:#93a1b9;
    --line:#2a3552; --accent:#7fe3c0; --gold:#ffd479; --focus:#ffd479;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:16px; line-height:1.5; min-height:100vh}
  a{color:var(--accent)}
  .wrap{max-width:1080px; margin:0 auto; padding:24px 16px 48px}
  header.top{display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel2)}
  header.top .brand{font-family:"DejaVu Sans Mono","Courier New",monospace; letter-spacing:3px; color:var(--accent); font-weight:700; text-decoration:none}
  header.top .crumbs{color:var(--dim); font-size:14px}
  .screen{display:none} .screen.on{display:block}
  h1.title{font-family:"DejaVu Sans Mono","Courier New",monospace; font-size:clamp(48px,10vw,88px); letter-spacing:12px; color:var(--accent); margin:24px 0 8px}
  h2{font-size:26px; margin:8px 0 4px} h2:focus{outline:none}
  .lede{font-size:18px; max-width:720px; color:var(--ink)}
  .note{color:var(--dim); font-size:15px; margin:0 0 18px}
  button{font:inherit; color:inherit}
  .btn{display:inline-flex; align-items:center; gap:8px; min-height:48px; padding:10px 20px; border-radius:10px; border:1px solid var(--line);
    background:#18213a; cursor:pointer; font-size:17px}
  .btn.primary{background:#1f4a3a; border-color:#3f9a73; color:#eafff5; font-weight:600}
  .btn:hover{border-color:var(--accent)}
  .btn[disabled]{opacity:.5; cursor:default}
  :focus-visible{outline:3px solid var(--focus); outline-offset:3px}
  .row{display:flex; flex-wrap:wrap; gap:12px; margin:18px 0}
  .back{background:none; border:none; color:var(--accent); cursor:pointer; padding:8px 0; min-height:44px; font-size:15px}
  .home-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; align-items:start; margin-top:24px}
  @media (max-width:760px){ .home-grid{grid-template-columns:1fr} }
  .fb{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px}
  .fb h3{margin:8px 0 2px; font-size:20px} .fb .tag{color:var(--gold); font-size:14px}
  details.how{margin-top:18px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 16px}
  details.how summary{cursor:pointer; min-height:32px; font-weight:600}
  .cards{list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px}
  .card{display:flex; flex-direction:column; align-items:stretch; gap:6px; width:100%; height:100%; text-align:left; cursor:pointer;
    background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:14px; min-height:120px}
  .card:hover{border-color:var(--accent)}
  .card[aria-disabled="true"]{cursor:not-allowed; opacity:.6}
  .card .head{display:flex; align-items:center; gap:10px}
  .card .icon{font-size:28px; line-height:1}
  .card h3{margin:0; font-size:20px}
  .card .tagline{font-size:16px}
  .card .chip{align-self:flex-start; font-size:13px; padding:2px 10px; border-radius:20px; border:1px solid #3a4a6e; color:var(--gold); background:#1a2238}
  .card .cue{color:var(--dim); font-size:15px; font-style:italic}
  .card .detail{font-size:15px; color:var(--ink)}
  .card .current{font-size:13px; color:var(--accent); font-weight:600}
  .card .unavail{font-size:14px; color:#ffb3a8}
  .card.chosen{border-color:var(--accent)}
  canvas.mini{width:100%; height:auto; aspect-ratio:3/2; border-radius:8px; background:#0a1220; image-rendering:pixelated; display:block}
  .pick{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin:0 0 18px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center}
  .brief{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; margin:16px 0}
  @media (max-width:760px){ .brief{grid-template-columns:1fr} }
  .brief section,.goal{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px}
  .brief h3{margin:0 0 6px; letter-spacing:2px; font-size:16px; color:var(--gold)}
  .brief .icon{font-size:24px; margin-right:6px}
  .goal h3{margin:0 0 6px; letter-spacing:2px; font-size:16px; color:var(--accent)}
  .goal p{font-size:18px; margin:0 0 10px}
  .goal ul{margin:0; padding-left:20px} .goal li{margin:2px 0}
</style>
</head>
<body>
<header class="top"><a class="brand" href="#/">BLOOM</a><span class="crumbs" id="crumbs"></span></header>
<main class="wrap">
  <section class="screen" id="scrHome" aria-labelledby="homeTitle">
    <h1 class="title" id="homeTitle" tabindex="-1">BLOOM</h1>
    <p class="lede" id="premise"></p>
    <div class="home-grid">
      <div class="fb" id="fbCard"></div>
      <div>
        <div class="row" style="flex-direction:column; align-items:stretch; margin-top:0">
          <button class="btn primary" type="button" id="btnFirstBloom"></button>
          <button class="btn" type="button" id="btnChoose"></button>
        </div>
        <details class="how" id="howTo"><summary>How to play</summary><ul id="howList"></ul></details>
      </div>
    </div>
  </section>

  <section class="screen" id="scrPlanets" aria-labelledby="planetsTitle">
    <button class="back" type="button" data-go="#/">← Home</button>
    <h2 id="planetsTitle" tabindex="-1"></h2>
    <p class="note" id="planetsNote"></p>
    <ul class="cards" id="planetCards"></ul>
  </section>

  <section class="screen" id="scrScenarios" aria-labelledby="scenariosTitle">
    <button class="back" type="button" id="backToPlanets">← Change planet</button>
    <h2 id="scenariosTitle" tabindex="-1"></h2>
    <div class="pick" id="scnPick"></div>
    <p class="note" id="scenariosNote"></p>
    <ul class="cards" id="scenarioCards"></ul>
  </section>

  <section class="screen" id="scrBrief" aria-labelledby="briefTitle">
    <button class="back" type="button" id="backToScenarios">← Change scenario</button>
    <h2 id="briefTitle" tabindex="-1">Your run</h2>
    <div class="brief">
      <section id="briefPlanet"></section>
      <section id="briefScenario"></section>
    </div>
    <div class="goal" id="briefGoal"></div>
    <div class="row">
      <button class="btn primary" type="button" id="btnStart"></button>
      <button class="btn" type="button" id="btnChangePlanet">Change planet</button>
      <button class="btn" type="button" id="btnChangeScenario">Change scenario</button>
    </div>
  </section>
</main>

<!-- data + generation only (the validator modules are loaded because bloom-archetype.js / bloom-play.js need them present;
     nothing on this page calls them) -->
<script src="content/config.js"></script>
<script src="content/traits.js"></script>
<script src="planets/first_bloom.js"></script>
<script src="content/archetypes.js"></script>
<script src="content/scenarios.js"></script>
<script src="content/play.js"></script>
<script src="resources/bloom-sim.js"></script>
<script src="resources/bloom-gen.js"></script>
<script src="resources/bloom-validate.js"></script>
<script src="resources/bloom-witness.js"></script>
<script src="resources/bloom-archetype.js"></script>
<script src="resources/bloom-scenario.js"></script>
<script src="resources/bloom-play.js"></script>
<script>
"use strict";
(function(){
  if(!window.BLOOM||!window.BLOOM_DATA||!BLOOM_DATA.play||!BLOOM.play){
    document.querySelector("main").innerHTML='<p style="color:#ff8b7a">BLOOM could not load its files. Open index.html from inside the full Bloom folder.</p>'; return; }
  const D=BLOOM_DATA, P=D.play, WIN=Math.round(D.config.win*100), $=id=>document.getElementById(id);
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fill=t=>String(t).replace(/\{win\}/g,WIN);
  // temporary icons for the data's icon keys (not final art)
  const ICON={islands:"🏝️", dunes:"🏜️", snowflake:"❄️", leaf:"🌿", hourglass:"⏳", sprouts:"🌱", storm:"🌪️", firstBloom:"🌼"};
  const icon=k=>`<span class="icon" aria-hidden="true">${ICON[k]||"•"}</span>`;
  const RUN="demos/demo-run.html";
  const planetById=id=>D.archetypes.find(a=>a.id===id)||null, scenarioById=id=>D.scenarios.find(s=>s.id===id)||null;

  /* ---- mini maps: raw terrain only (generation, no validation), drawn in the run page's temporary map colours ---- */
  const STOPS=[[-40,[44,62,104]],[-20,[78,104,140]],[0,[100,126,116]],[12,[92,140,88]],[25,[156,146,84]],[40,[182,100,60]],[60,[150,58,46]]];
  const mix=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function stops(v){ if(v<=STOPS[0][0]) return STOPS[0][1]; const L=STOPS[STOPS.length-1]; if(v>=L[0]) return L[1];
    for(let i=0;i<STOPS.length-1;i++){ const [a,ca]=STOPS[i],[b,cb]=STOPS[i+1]; if(v<=b) return mix(ca,cb,(v-a)/(b-a)); } return L[1]; }
  const previews=new Map();
  function previewPlanet(key){ if(previews.has(key)) return previews.get(key);
    const p=key==="first_bloom"?D.planets.first_bloom:BLOOM.archetype.attemptPlanet(planetById(key), planetById(key).display.previewSeed, 0).planet;
    previews.set(key,p); return p; }
  function drawMini(cv, key){
    const planet=previewPlanet(key), R=(planetById(key)||{}).render||null, lay=BLOOM.resolveLayout(planet, D.config), W=planet.gridWidth, H=planet.gridHeight;
    const T=Math.max(2,Math.floor(480/W)); cv.width=W*T; cv.height=H*T; const ctx=cv.getContext("2d"), gc=planet.globalClimate;
    const water=(R&&R.water)||[24,52,92], waterAlt=(R&&R.waterAlt)||[30,62,104];
    const col=lay.sections.map(s=>{ const t=gc.temperature+s.local.tempOffset, m=gc.moisture+s.local.moistureOffset; let c=stops(t);
      if(m<35) c=mix(c,[150,138,104],0.4); else if(m>68) c=mix(c,[64,104,104],0.35);
      if(R&&R.ground) c=mix(c,R.ground,R.groundMix*(R.tintBy==="cold"?clamp((4-t)/24,0.12,1):(m<35?1:0.5)));
      return c; });
    const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`, tm=lay.tilemap;
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=y*W+x, s=tm[i];
      ctx.fillStyle=s<0?rgb((x+y)%7===0?waterAlt:water):rgb(col[s]); ctx.fillRect(x*T,y*T,T,T);
      if(s>=0){ ctx.fillStyle="rgba(8,10,16,.45)"; // faint region borders
        if(x+1<W&&tm[i+1]>=0&&tm[i+1]!==s) ctx.fillRect((x+1)*T-1,y*T,1,T);
        if(y+1<H&&tm[i+W]>=0&&tm[i+W]!==s) ctx.fillRect(x*T,(y+1)*T-1,T,1); } }
  }
  const miniCanvas=(key,label)=>{ const cv=document.createElement("canvas"); cv.className="mini"; cv.setAttribute("role","img"); cv.setAttribute("aria-label",label);
    requestAnimationFrame(()=>{ try { drawMini(cv,key); } catch(e){ /* a preview is decoration only */ } }); return cv; };

  /* ---- screens ---- */
  const SCREENS=["scrHome","scrPlanets","scrScenarios","scrBrief"];
  function show(id, crumbs){ SCREENS.forEach(s=>$(s).classList.toggle("on",s===id)); $("crumbs").textContent=crumbs||""; }
  const go=h=>{ location.hash=h; };
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));

  // home
  $("premise").textContent=fill(P.home.premise);
  $("btnFirstBloom").textContent=P.firstBloom.action; $("btnChoose").textContent=P.choose.action;
  $("howList").innerHTML=P.home.howTo.map(t=>`<li>${esc(t)}</li>`).join("");
  let fbDrawn=false;
  function renderHome(){ if(fbDrawn) return; fbDrawn=true; const F=P.firstBloom;
    $("fbCard").innerHTML=`<div id="fbMini"></div><h3>${icon("firstBloom")} ${esc(F.name)}</h3><div class="tag">${esc(F.tagline)}</div><p>${esc(F.summary)}</p>`;
    $("fbMini").appendChild(miniCanvas("first_bloom", `${F.name} map preview`)); }
  $("btnFirstBloom").addEventListener("click",e=>{ e.currentTarget.disabled=true; location.href=RUN+"?play=1"; });
  $("btnChoose").addEventListener("click",()=>go("#/planet"));

  // planet selection: one card per archetype in the data (no compatibility or difficulty logic here)
  $("planetsTitle").textContent=P.choose.planetsTitle; $("planetsNote").textContent=P.choose.planetsNote;
  let planetCardsBuilt=false;
  function renderPlanets(current){
    if(!planetCardsBuilt){ planetCardsBuilt=true;
      $("planetCards").innerHTML=D.archetypes.map(A=>{ const d=A.display||{};
        return `<li><button type="button" class="card" data-planet="${esc(A.id)}" aria-describedby="pc-${esc(A.id)}">
          <span class="mini-slot"></span>
          <span class="head">${icon(d.icon)}<h3>${esc(A.name)}</h3></span>
          <span class="tagline">${esc(d.tagline||"")}</span>
          ${d.character?`<span class="chip">Main problem: ${esc(d.character)}</span>`:""}
          <span class="cue" id="pc-${esc(A.id)}">${esc(d.cue||"")}</span>
          <span class="current" hidden>✓ Your current choice</span></button></li>`; }).join("");
      $("planetCards").querySelectorAll("button.card").forEach(b=>{
        b.querySelector(".mini-slot").replaceWith(miniCanvas(b.dataset.planet, `${planetById(b.dataset.planet).name} map preview`));
        b.addEventListener("click",()=>go(`#/scenario/${b.dataset.planet}`)); }); }
    $("planetCards").querySelectorAll("button.card").forEach(b=>{ const on=b.dataset.planet===current;
      b.classList.toggle("chosen",on); b.querySelector(".current").hidden=!on; });
    return current&&$("planetCards").querySelector(`button[data-planet="${current}"]`);
  }

  // scenario selection: one card per scenario in the data; a combination the scenario's data marks DISALLOWED is disabled
  // with the data's own reason (BLOOM.play.availability) — never a UI rule
  $("scenariosTitle").textContent=P.choose.scenariosTitle; $("scenariosNote").textContent=P.choose.scenariosNote;
  function renderScenarios(A, current){
    const d=A.display||{};
    $("scnPick").innerHTML=`<span>Planet: <b>${esc(A.name)}</b></span><span style="color:var(--dim)">${esc(d.tagline||"")}</span>`;
    $("backToPlanets").onclick=()=>go(`#/planet/${A.id}`);
    $("scenarioCards").innerHTML=D.scenarios.map(S=>{ const c=(S.display&&S.display.card)||{}, av=BLOOM.play.availability(S,A.id);
      return `<li><button type="button" class="card${S.id===current?" chosen":""}" data-scenario="${esc(S.id)}" ${av.allowed?"":`aria-disabled="true"`} aria-describedby="sc-${esc(S.id)}">
        <span class="head">${icon(c.icon)}<h3>${esc(S.name)}</h3></span>
        ${c.tag?`<span class="chip">${esc(c.tag)}</span>`:""}
        <span class="tagline">${esc(c.tagline||S.display.summary||"")}</span>
        ${c.detail?`<span class="detail">${esc(c.detail)}</span>`:""}
        <span class="cue" id="sc-${esc(S.id)}">${esc(c.cue||"")}</span>
        ${av.allowed?"":`<span class="unavail">Not available on ${esc(A.name)}: ${esc(av.reason)}</span>`}
        ${S.id===current?`<span class="current">✓ Your current choice</span>`:""}</button></li>`; }).join("");
    $("scenarioCards").querySelectorAll("button.card").forEach(b=>b.addEventListener("click",()=>{
      if(b.getAttribute("aria-disabled")==="true") return; go(`#/brief/${A.id}/${b.dataset.scenario}`); }));
    return current&&$("scenarioCards").querySelector(`button[data-scenario="${current}"]`);
  }

  // briefing: planet + scenario + goal + three reminders; then Start hands the selection to the run page
  function renderBrief(A,S){
    const d=A.display||{}, c=(S.display&&S.display.card)||{}, B=P.briefing;
    $("briefPlanet").innerHTML=`<h3>${icon(d.icon)}${esc(A.name.toUpperCase())}</h3><p>${esc(d.detail||d.tagline||"")}</p>`;
    $("briefScenario").innerHTML=`<h3>${icon(c.icon)}${esc(S.name.toUpperCase())}</h3><p>${esc(c.detail||c.tagline||"")}</p>`;
    $("briefGoal").innerHTML=`<h3>YOUR GOAL</h3><p id="goalText">${esc(fill(B.goal))}</p><ul id="reminders">${B.reminders.map(r=>`<li><b>${esc(r.verb)}</b> ${esc(r.text)}</li>`).join("")}</ul>`;
    $("btnStart").textContent=B.start; $("btnStart").disabled=false;
    $("btnStart").onclick=e=>{ e.currentTarget.disabled=true; // one start only
      location.href=RUN+"?"+BLOOM.play.runQuery({archetype:A.id, scenario:S.id}); };
    $("btnChangePlanet").onclick=()=>go(`#/planet/${A.id}`);
    $("btnChangeScenario").onclick=()=>go(`#/scenario/${A.id}/${S.id}`);
    $("backToScenarios").onclick=()=>go(`#/scenario/${A.id}/${S.id}`);
  }

  /* ---- router ---- */
  let lastPlanet=null, lastScenario=null;
  function route(){
    const parts=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean).map(decodeURIComponent);
    let focusEl=null;
    if(parts[0]==="planet"){ const cur=planetById(parts[1])?parts[1]:lastPlanet; show("scrPlanets", "› Planet");
      focusEl=renderPlanets(cur)||$("planetsTitle"); }
    else if(parts[0]==="scenario"&&planetById(parts[1])){ const A=planetById(parts[1]); lastPlanet=A.id;
      const cur=scenarioById(parts[2])?parts[2]:(lastScenario&&scenarioById(lastScenario)?lastScenario:null);
      show("scrScenarios", `› ${A.name} › Scenario`); focusEl=renderScenarios(A,cur)||$("scenariosTitle"); }
    else if(parts[0]==="brief"&&planetById(parts[1])&&scenarioById(parts[2])&&BLOOM.play.availability(scenarioById(parts[2]),parts[1]).allowed){
      const A=planetById(parts[1]), S=scenarioById(parts[2]); lastPlanet=A.id; lastScenario=S.id;
      show("scrBrief", `› ${A.name} › ${S.name}`); renderBrief(A,S); focusEl=$("btnStart"); }
    else if(parts.length){ go("#/planet"); return; } // an unknown or unavailable route never starts anything
    else { show("scrHome",""); renderHome(); focusEl=null; }
    if(focusEl&&(route.ready||parts.length)) focusEl.focus(); route.ready=true; // a deep link (e.g. Change planet from a run) focuses too
    window.scrollTo(0,0);
  }
  window.addEventListener("hashchange",route); route();
  // QA hook: re-render the current screen (e.g. after a test changes scenario data); no game logic lives here
  window.BLOOM_LAUNCHER={ rerender(){ planetCardsBuilt=false; fbDrawn=false; route(); } };
})();
</script>
</body>
</html>

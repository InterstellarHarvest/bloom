# STRANGE BLOOM · UNKNOWN SOILS — publish the production game to GitHub Pages (BLOOM-031; docs/PORTABLE_RUNTIME_v1.md).
# Static only: the game's own files, copied as they are by tools/build-pages-site.mjs (Node built-ins; no npm install, no build, no
# server code, no analytics). Official GitHub Pages actions only. Served at https://<owner>.github.io/bloom/ — every game URL is
# relative, so the project subpath needs no configuration.
# One-time repository setting: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the static site
        run: node tools/build-pages-site.mjs _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

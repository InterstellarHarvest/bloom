<title>BLOOM — developer run harness</title>
<!--
  BLOOM demo-run.html — the DEVELOPER RUN HARNESS (BLOOM-033). NOT a player-facing page: the game is ONE document, the repository root
  index.html (title → Training / Destination Survey → gameplay → report → back, all inside it; docs/SINGLE_DOCUMENT_APP_v1.md), and it
  never navigates to or loads this file. This page is a THIN wrapper around the SAME GameSession index.html uses
  (resources/run/game-session.js): it reads developer query parameters (archetype=, seed=, scenario=default|<id>, planet=, play=1,
  training=1, ui=legacy, candidates=, avoid= …), builds the run descriptor, and calls BLOOM.gameSession.create. It holds no copy of the
  run implementation. ?ui=legacy instantiates the historical engineering shell (the <template> below) for the regression oracles; the
  run's former page-level bindings (sim, selected, draw, renderInspect …) are installed on window from session.debug so those suites keep
  driving them by name. Everything below this paragraph is the page's HISTORY (what each milestone added to the run, now in GameSession).

  The "Next Playable Slice" (bible v1.1 + docs/NEXT_PLAYABLE_SLICE_v1.0.md):
  ONE complete default-scenario run on an authored 9-section planet, proving the core loop:
     see barrier → buy answer → watch spread resume → earn faster → solve tradeoff → win 70%.
  Includes: sim tick (Barren/Living/Dead, vigor, hysteresis, damped die-back, recovery),
  4-category readout (Temperature/Water/Soil/Hazard) + named limiting factor + raw-on-click,
  passive Biomass + bonus bubbles (auto-collect fallback), a temporary Spread/Adapt/Terraform
  upgrade set, 70%-coverage win + a compact Bloom Report.
  Temporary UI / dark scaffolding is intentional (final art deferred). Boots over file://.
  2026-09-26 tuning pass: ~6–8 min pacing, hover/focus purchase preview (regions opened/closed),
  Bloom Report names the regions your build gave up + a real-plant analog per adaptation + a drawn plant.
  BLOOM-002 (2026-09-26): this file is now UI + rendering only. The simulation is resources/bloom-sim.js,
  numbers are content/config.js, upgrades are content/traits.js, the planet is planets/first_bloom.js.
  Test hook: window.BLOOM_API = { buy, sim, advance, coverage, state } for headless checks.
  Headless QA: tools/slice-check.js (drives the real buttons) · tools/sim-check.js (engine golden, Node).
  BLOOM-007 (developer/playtest harness, NOT the planet menu): with no query string this is First Bloom,
  unchanged. demo-run.html?archetype=ocean_archipelago&seed=13 generates that public seed through the real
  BLOOM.generateFromArchetype production path (validator layers 1–8) and plays it with the same UI; a seed
  that fails generation shows an explicit failure state (never another seed). QA: tools/procedural-run-check.js.
  BLOOM-008 (temporary UI, not final): Colony Focus in the inspect panel (Roots / Leaves / Seeds on ONE Living region,
  set-and-leave), an ordinary-language colony status (Sparse → Establishing → Established → Dense), and map vegetation
  shaded by each tile's stand density (light, gappy seedlings → dark, full stands).
  BLOOM-009 (temporary UI, not final): EVERY Living region keeps its own growth focus (Balanced / Roots / Leaves / Seeds) and
  may buy ONE local upgrade (Root Network / Leaf Canopy / Seed Reserve) with Biomass; small map badges show each region's
  focus + upgrade; Biomass is the dominant HUD element; seedlings start tiny; Waterborne crossings show seeds travelling
  over water (pale ripple = seeds arrived, bright burst = they took root). QA: tools/colony-development-check.js.
  BLOOM-010: the same launch path plays the second archetype (?archetype=desert_world&seed=25). An archetype may carry
  a tiny temporary map treatment as data (archetype.render: ground tint, water colours, dune stipple); water-crossing
  wording in the colony panel appears only where a crossing trait is offered. QA: tools/desert-check.js.
  BLOOM-011: the third archetype (?archetype=frozen_world&seed=22). render.tintBy "cold" + frost glints (data); the inspect
  panel shows the region's ground temperature, the sky and the plant's temperature range in °C, and notes geothermal ground;
  a Terraform preview / purchase names every region the new sky opens, moves closer (still blocked), makes worse or closes,
  outlines them for a few seconds and shows the change next to the HUD sky (temporary functional readouts, not the
  specimen/environment panel). QA: tools/frozen-check.js.
  BLOOM-012 (temporary functional UI, not the final layout): pressure scenarios. &scenario=<id> picks a scenario from
  content/scenarios.js independently of the planet (no parameter = the default scenario = everything above, unchanged; an unknown id is an
  explicit failure, never a substitute). A pressured run is started only if the planet + scenario pass the scenario
  validation layer (resources/bloom-scenario.js). It adds a full-width pressure bar under the HUD (scenario identity, phase,
  progress + time to the next stage, the live drift per channel and the sky as base + Terraform + scenario drift = now),
  a faint haze over the map that thickens with the decline, milestone messages at the scenario's phase thresholds, short
  outlines + messages when a living region tips toward its limit, the drift in the inspect panel, an extinction screen
  (with restart) and the scenario's final state in the Bloom Report. QA: tools/dying-world-check.js.
  BLOOM-014 (temporary functional UI, not the final layout): competition scenarios (any scenario with a `competition` block,
  launched with &scenario=<id>). Native vegetation is drawn from the engine's real tile state (sim.competition.native) as a
  hatched violet stand that thickens with its density; amber lines mark the fronts where it touches the player's plants. The
  inspect panel adds a short competition readout (who has the advantage here and why, in plain words); a slim status bar under
  the HUD shows native-held land, its trend and the contested regions (no clock: there is none); engine events (first contact,
  your advantage, native retakes, native-dominated region) become messages + short outlines; Terraform previews also say where
  the new sky suits the native plants more or less; the Bloom Report adds one competition line. QA: tools/native-competition-check.js.
  BLOOM-015 (temporary functional UI, not the final layout): climate-instability scenarios (any scenario with a
  `climateInstability` block). A slim status bar under the HUD shows the engine's live instability (sim.climate): overall %
  and band on a meter with the shock threshold marked, each sky axis's own instability, an announced or active shock (kind,
  size, time left), a one-line forecast, and the sky as base + Terraform + shock = now (never a countdown: there is no
  clock). Terraform previews / purchases add the instability change (axis, % before → after, band change) and warn when the
  step will set off a shock (likely kind and size). During a shock the map takes a faint tint of its kind and the ground
  colours follow the shocked sky; regions it pushes across a threshold (or that reopen when it ends) get a message + short
  outline; the inspect panel shows the shock in the region's temperature line. The Bloom Report and the extinction screen
  add one climate line. QA: tools/volatile-climate-check.js.
  BLOOM-016 (temporary shell, not the final layout): player mode, ?play=1. (BLOOM-030: the BLOOM-016 launcher that opened it is
  retired — the root index.html is now the Strange Bloom title — so this is a direct developer path; its exits go to that title.)
  With an archetype but no seed it shows "Preparing planet…" and runs BLOOM.play.searchWorld (resources/bloom-play.js) over
  automatically chosen World Seeds (in resources/bloom-play-worker.js when the browser allows a worker; on file:// on the page,
  one step per task), starts the first world that passes layers 1–8 (+ layer P for a dynamic scenario), and writes
  ?play=1&archetype=…&seed=…&scenario=… into the address. A rejected candidate never starts; all rejected → a friendly
  "No playable world found" screen, never a substitute. Player wording (World Seed), a header Menu (Play this world again ·
  Same planet, new world · Change scenario · Change planet · Home; confirms before leaving a live run) and the same actions
  under the Bloom Report / extinction screen. Every action opens a fresh page. Without play=1 nothing here changes: the
  developer harness above is untouched. QA: tools/game-flow-check.js.
  BLOOM-028D1 (training foundation; no coaching UI yet): ?planet=<id> opens any AUTHORED world by id (BLOOM_DATA.planets; no
  planet= = First Bloom, exactly as before). ?training=1 is the training run, opened by the title's TRAINING: the authored
  Training Grounds (planets/training_grounds.js; content/training.js), PAUSED at the landing, on a config derived for it
  (BLOOM.play.deriveConfig — the shared config is never touched) with a seeded random stream; the run menu and the report offer
  Restart training · Skip training · Main menu, and &return=<url> (same origin only) is where they go. The training layer
  (resources/training/training-run.js, loaded in training mode only) fades the arrival / exits and records the training status.
  For every run: generic bloom:* events on document at the real action points (play-pause, speed, region-select,
  upgrade-preview, upgrade-purchase, growth-focus, local-upgrade, bubble-collect, win, run-ready), stable data-tutorial anchors
  on the controls, and BLOOM_RUN_UI.placeBubble(sectionId) for a bonus bubble placed on purpose. Contracts:
  docs/TRAINING_FOUNDATION_v1.md. QA: tools/training-check.js.
  BLOOM-028D2 (guided training): in training mode on the production UI the training layer mounts the guided coach (thirteen
  outcome-driven lessons that point at the real controls; the player acts, the coach observes) and asks once before a skip; the
  finished training's report offers Begin Expedition · Restart training · Main menu (no Keep playing). docs/GUIDED_TRAINING_v1.md.
  BLOOM-029F (exact expedition handoff; RETIRED by BLOOM-033): ?play=1&expedition=<token> used to be an EXPEDITION run — the exact
  Destination Survey planet carried across the page boundary in a session handoff. Since BLOOM-033 an expedition never leaves index.html
  (the selected planet object goes straight into the sim), the handoff and its arrival cover are deleted, and an expedition= link here is
  an explicit "retired" failure — never First Bloom, never another world.
  BLOOM-029E (gameplay UI convergence): the PRODUCTION UI is the DEFAULT run interface. With no ui= query (and with the alias ui=18)
  this page mounts the production Planet View, its four rooms and the production run report (resources/run-ui/run-report.js) over the
  same run, for every launch (First Bloom, planet=, generated, every scenario, play=1, training=1). Room swaps and the report open /
  close through ONE SUBDUED AtmosphereTransition (resources/run-ui/gameplay-transition.js). The engineering shell below (header HUD,
  inspect / shop sidebars, canvas, footer, report modal) is RETIRED as a player-facing path: it stays only as the hidden simulation
  host the adapter wraps (its DOM and functions are the one real run) and as the historical regression oracle, shown ONLY by the
  developer flag ?ui=legacy (never linked from the game). The report's truth is factored into winReport() / lossReport() below: the
  modal and the production report read the same structured data; reportActions() / reportAction() own the post-run actions.
  BLOOM-029D: the fourth production room, Terraform (same controller; resources/run-ui/terraform-globe.js hosts the unmodified
  PlanetSphereView showing the exact current planet under the current sky). computePreview records the real current → preview sky.
  BLOOM-029C: with &ui=18 the production decision rooms (resources/run-ui/decision-rooms.js: Region Inspect, Adapt, Spread; the
  production plant specimen resources/run-ui/plant-specimen.js) mount into the Planet View's room seam, over the same adapter.
  BLOOM-029B (migration path): &ui=18 shows the PRODUCTION Planet View (resources/run-ui/planet-view.js, Concept 18) over the
  SAME run: it reads and acts only through BLOOM_RUN_UI.adapter, draws the map with resources/run-ui/run-map-renderer.js over
  the canonical planet surface (resources/planet-surface/planet-surface.js, the same surface PlanetSphereView wraps), and
  hides the temporary shell below. Without ui=18 nothing here changes. THE SHELL BELOW (header HUD, inspect / shop sidebars,
  footer, its draw()) IS MIGRATION-ONLY: it stays as the full-mechanics regression harness until the 029C/029D rooms exist and
  BLOOM-029E makes the production UI the default and retires it. docs/PRODUCTION_PLANET_VIEW_v1.md.
-->
<style>
  :root{
    --bg:#0b0e14; --panel:#121826; --panel2:#0e1320; --ink:#cdd6e6; --dim:#7c8aa3;
    --line:#26304a; --accent:#7fe3c0; --gold:#ffd479; --bad:#ff6b6b; --ok:#7fe3a0; --warn:#ffcf6b;
    --green:#66d17f; --yellow:#e7c14e; --red:#e2604f; --focus:#f59ad8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--ink); font-family:"DejaVu Sans Mono","Courier New",monospace;
    font-size:13px; line-height:1.45; display:grid; grid-template-rows:auto 1fr auto; height:100vh; overflow:hidden}
  header{display:flex; align-items:center; gap:16px; padding:8px 16px; flex-wrap:wrap;
    background:linear-gradient(180deg,#141b2c,#0e1320); border-bottom:1px solid var(--line)}
  header h1{font-size:13px; margin:0; letter-spacing:2px; color:var(--accent); white-space:nowrap}
  header h1 small{color:var(--dim); letter-spacing:1px; font-weight:normal}
  .hud{display:flex; gap:16px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--dim)}
  .hud b{color:var(--ink)}
  /* BLOOM-009: Biomass is the primary currency, so it is the largest thing in the HUD */
  .bio{position:relative; display:flex; align-items:center; gap:10px; padding:4px 14px 4px 8px; border-radius:26px; background:linear-gradient(180deg,#3a2c0c,#241a06);
    border:2px solid #8a6a22; box-shadow:0 0 0 1px #000 inset; min-width:190px; transition:box-shadow .25s, border-color .25s}
  .bio .leaf{width:30px; height:30px; flex:0 0 auto; background:radial-gradient(circle at 35% 30%,#ffe9a8,#e9b43a 60%,#9b6a12); border-radius:0 70% 0 70%; transform:rotate(-12deg); box-shadow:0 0 6px rgba(255,212,121,.45)}
  .bio .bnum{display:flex; flex-direction:column; line-height:1}
  .bio .blbl{font-size:10px; letter-spacing:2px; color:#caa55a}
  .bio b#hBio{font-size:30px; color:var(--gold); font-weight:700; letter-spacing:1px; font-variant-numeric:tabular-nums}
  .bio .brate{font-size:11px; color:#caa55a; margin-left:auto; white-space:nowrap}
  .bio.up{border-color:#ffe08a; box-shadow:0 0 14px rgba(255,212,121,.75)}
  .bio.down{border-color:#e2604f; box-shadow:0 0 14px rgba(226,96,79,.7)}
  .bio .spend{position:absolute; right:14px; top:-4px; color:#ff8b7a; font-weight:700; font-size:16px; pointer-events:none; animation:floatUp 1.1s ease-out forwards}
  @keyframes floatUp{from{opacity:1; transform:translateY(0)} to{opacity:0; transform:translateY(-18px)}}
  .covwrap{display:flex; align-items:center; gap:8px}
  .covbar{position:relative; width:200px; height:14px; background:#0a1220; border:1px solid var(--line); border-radius:7px; overflow:hidden}
  .covfill{position:absolute; left:0; top:0; bottom:0; width:0%; background:linear-gradient(90deg,#3f8f63,#66d17f); transition:width .2s}
  .covwin{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--gold)}
  .skyd{color:var(--gold); font-weight:700} /* BLOOM-011: the sky's last Terraform change, shown for a few seconds */
  .tline{margin:-4px 0 8px; padding:0 8px; font-size:11px; color:var(--dim)} .tline b{color:var(--ink); font-weight:600}
  .therm{margin:8px 0; padding:8px; border-radius:5px; background:#2a1a12; border:1px solid #6a3f22; color:#f0c49a; font-size:11px}
  .controls{margin-left:auto; display:flex; gap:8px; align-items:center}
  button{font:inherit; cursor:pointer}
  button.tb{background:#1a2236; color:var(--ink); border:1px solid var(--line); padding:5px 10px; font-size:12px; border-radius:4px}
  button.tb[aria-pressed="true"]{background:#23406a; border-color:var(--accent); color:#fff}
  button.tb:hover{border-color:var(--accent)}

  main{display:grid; grid-template-columns:290px 1fr 240px; min-height:0}
  .stage{position:relative; display:flex; align-items:center; justify-content:center; padding:12px; min-height:0; overflow:hidden}
  canvas{background:#05070c; border:1px solid var(--line); border-radius:3px; image-rendering:pixelated; cursor:crosshair; max-width:100%; max-height:100%}
  aside{background:var(--panel); overflow:auto; padding:12px; font-size:12px}
  aside.left{border-right:1px solid var(--line)}
  aside.right{border-left:1px solid var(--line)}
  aside h2{font-size:11px; letter-spacing:2px; color:var(--gold); margin:0 0 8px}
  .secname{font-size:15px; color:#fff; letter-spacing:1px; margin-bottom:2px}
  .badge{display:inline-block; padding:1px 6px; border-radius:3px; font-size:10px; letter-spacing:1px;
    background:#3a2a12; color:var(--gold); border:1px solid #6a4d1c; margin-left:6px}

  .cats{margin:10px 0}
  .cat{display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:5px; margin-bottom:5px; background:#0e1524; border:1px solid #1b2439}
  .cat .lamp{width:11px; height:11px; border-radius:50%; flex:0 0 auto}
  .cat .lbl{color:var(--dim); width:80px; flex:0 0 auto}
  .cat .tag{margin-left:auto; color:var(--dim); font-size:9px; white-space:nowrap}
  .cat .st{color:var(--ink); font-weight:600}
  .lamp.green{background:var(--green)} .lamp.yellow{background:var(--yellow)} .lamp.red{background:var(--red)}
  .limit{margin:8px 0; padding:8px; border-radius:5px; background:#241a12; border:1px solid #55401f; color:var(--gold)}
  .limit.ok{background:#132417; border-color:#2c5335; color:var(--ok)}
  .fixhint{font-size:11px; color:var(--dim); margin-top:4px}
  details.raw{margin-top:8px} details.raw summary{cursor:pointer; color:var(--dim); font-size:11px}
  table.kv{width:100%; border-collapse:collapse; margin-top:6px} table.kv td{padding:2px 4px; border-bottom:1px solid #1a2236}
  table.kv td:first-child{color:var(--dim)} table.kv td:last-child{text-align:right}
  .vitals{margin-top:10px; font-size:11px}
  .vbar{display:flex; height:12px; border:1px solid var(--line); border-radius:3px; overflow:hidden; margin-top:3px}
  .vbar i{display:block} .vbar .vl{background:#4c9e63} .vbar .vd{background:#6b4a33} .vbar .vb{background:#1a2436}

  .shop .grp{margin-bottom:12px}
  .shop .grp h3{font-size:11px; letter-spacing:1px; margin:0 0 6px; color:var(--accent); text-transform:uppercase}
  .buy{display:flex; align-items:center; justify-content:space-between; gap:6px; width:100%; text-align:left;
    background:#141d30; border:1px solid #22304d; color:var(--ink); padding:6px 8px; border-radius:5px; margin-bottom:5px; font-size:12px}
  .buy:hover:not(.off){border-color:var(--accent)}
  .buy.off{opacity:.42; cursor:default} /* not [disabled]: unaffordable upgrades must still hover-preview */
  .buy .nm{display:flex; flex-direction:column}
  .buy .nm small{color:var(--dim); font-size:10px}
  .buy .cost{color:var(--gold); white-space:nowrap}
  .buy.poor .cost{color:#ff8b7a} /* can't afford it yet: the price turns red */
  .buy.owned{border-color:#2c5335; background:#122017}
  .temppool{font-size:11px; color:var(--dim); margin-bottom:6px}

  footer{border-top:1px solid var(--line); background:var(--panel2); padding:6px 16px; font-size:11px; color:var(--dim);
    display:flex; gap:20px; align-items:center; overflow-x:auto; white-space:nowrap}
  .log{color:var(--ink)}

  .modal{position:fixed; inset:0; background:rgba(4,6,12,.82); display:none; align-items:center; justify-content:center; z-index:20}
  .modal.on{display:flex}
  .report{width:min(560px,92vw); max-height:88vh; overflow:auto; background:#111a2b; border:1px solid #2c3f63; border-radius:10px; padding:22px}
  .report h2{color:var(--gold); letter-spacing:2px; margin:0 0 4px}
  .report .sub{color:var(--dim); margin-bottom:14px}
  .report .debrief{background:#0e1626; border:1px solid #22304d; border-radius:6px; padding:12px; margin:12px 0; line-height:1.6}
  .report ul{margin:8px 0 0; padding-left:18px} .report li{margin:3px 0}
  .report .top{display:flex; gap:16px; align-items:flex-start}
  .report canvas#plantCv{flex:0 0 auto; background:#0b1322; border:1px solid #22304d; border-radius:6px; cursor:default}
  .report .analog li{margin:5px 0} .report .analog b{color:var(--accent)}
  .report .btn{margin-top:14px; background:#243b2f; border:1px solid #2f6a4d; color:#cdeede; padding:8px 16px; border-radius:6px}
  /* BLOOM-007 procedural harness: run identity, water / island notes, generation failure */
  .runid{margin-left:auto; color:#5d6a82; font-size:10px}
  .geo{margin:8px 0; padding:8px; border-radius:5px; background:#0f1d2c; border:1px solid #24435f; color:#9cc8e8; font-size:11px}
  .genfail{max-width:640px; margin:40px auto; padding:22px; background:#1f1418; border:1px solid #6a2f36; border-radius:10px; line-height:1.6}
  .genfail h2{color:var(--bad); letter-spacing:2px; margin:0 0 8px; font-size:14px}
  .genfail code{color:var(--gold)}
  /* BLOOM-008: colony status + Colony Focus (temporary inspect-panel control) */
  .colony{margin:8px 0; padding:8px; border-radius:5px; background:#0f1a14; border:1px solid #24452f}
  .colony .cw{color:#fff; font-weight:600}
  .dbar{height:8px; border:1px solid var(--line); border-radius:3px; margin-top:4px; background:#1a2436; overflow:hidden}
  .dbar i{display:block; height:100%; background:linear-gradient(90deg,#b2d678,#227a38)}
  /* BLOOM-009: per-region growth focus + local upgrade (temporary inspect-panel controls) */
  .focus{margin:8px 0; padding:10px; border-radius:8px; background:#1a1422; border:1px solid #4a3160}
  .focus h3{font-size:12px; letter-spacing:1px; margin:0 0 4px; color:var(--focus)}
  .focus .fnote{font-size:11px; color:var(--dim); margin-bottom:6px}
  .fgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px}
  .fbtn{display:flex; flex-direction:column; align-items:flex-start; text-align:left; background:#211a2e; border:2px solid #3d2d52; color:var(--ink);
    padding:8px 9px; border-radius:8px; font-size:14px; min-height:54px}
  .fbtn .fi{font-size:16px; margin-right:4px}
  .fbtn small{color:var(--dim); font-size:10px; margin-top:2px}
  .fbtn:hover:not(.off){border-color:var(--focus)}
  .fbtn[aria-pressed="true"]{background:#3a2350; border-color:var(--focus); color:#fff}
  .fbtn.off{opacity:.42; cursor:default}
  .fstate{font-size:11px; color:var(--focus); margin:6px 0 2px}
  .ftip{font-size:11px; color:#b9d9a0; margin:4px 0 0}
  .local{margin-top:10px; padding-top:8px; border-top:1px dashed #4a3160}
  .local h3{color:var(--gold)}
  .sbtn{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; text-align:left; background:#241d10; border:2px solid #5b4520;
    color:var(--ink); padding:7px 9px; border-radius:8px; margin-bottom:5px; font-size:13px; min-height:46px}
  .sbtn small{display:block; color:var(--dim); font-size:10px}
  .sbtn .scost{display:flex; align-items:center; gap:4px; color:var(--gold); font-weight:700; font-size:15px; white-space:nowrap}
  .sbtn .scost i{width:12px; height:12px; background:radial-gradient(circle at 35% 30%,#ffe9a8,#e9b43a 60%,#9b6a12); border-radius:0 70% 0 70%; display:inline-block}
  .sbtn:hover:not(.off){border-color:var(--gold)}
  .sbtn.off{opacity:.55; cursor:default}
  .sbtn.poor .scost{color:#ff8b7a}
  .sbtn .need{display:block; font-size:10px; color:#ff8b7a; font-weight:normal}

<script>
"use strict";
/* ========================================================================== */
/*  BOOT (BLOOM-007): choose the planet, then start the run (a GameSession).   */
/*  No query string → First Bloom (the accepted slice, unchanged).             */
/*  ?archetype=<id>&seed=<public seed> → BLOOM.generateFromArchetype, the real */
/*  production path (validator layers 1–8). Failure → explicit failure state;  */
/*  another seed is never substituted and no world starts.                     */
/*  BLOOM-012: &scenario=<id> (content/scenarios.js), orthogonal to the planet.*/
/*  None → the default scenario. Unknown / malformed → explicit failure.       */
/*  A pressure scenario starts only if planet + scenario pass layer P          */
/*  (BLOOM.validateScenario, real pressured witnesses); its solutions are      */
/*  never handed to the UI.                                                    */
/* ========================================================================== */
// the run summary of an accepted procedural world (shared by the harness and the BLOOM-016 player path)
const procSummary=(A,planet)=>{ const a=planet.archetype; return {kind:"procedural", archetypeId:A.id, archetype:A.name, publicSeed:a.publicSeed,
  attempt:a.attempt, planetId:planet.id, name:planet.name, validatedLayers:a.validatedLayers, landmasses:a.landmasses, actualWaterPct:a.actualWaterPct}; };
function harnessRun(){
  if(!window.BLOOM||!window.BLOOM_DATA||!BLOOM_DATA.planets||!BLOOM_DATA.planets.first_bloom) return {kind:"missing"};
  const q=new URLSearchParams(location.search), aid=q.get("archetype"), seedText=q.get("seed"), scText=q.get("scenario");
  const kind=aid===null&&seedText===null?"authored":"procedural";
  const fail=(why,extra={})=>({kind, failed:true, summary:{kind, failed:true, archetypeId:aid, seed:seedText, scenarioId:scText, why, ...extra}});
  // BLOOM-028D1: planet=<id> names an AUTHORED world (BLOOM_DATA.planets); training=1 opens the training world
  // (BLOOM_DATA.training.planetId, unless planet= names another) — authored only, default scenario only, never a substitute
  const training=q.get("training")==="1", planetText=q.get("planet"), who={planetName:training?"Training":`planet ${planetText}`};
  if((training||planetText!==null)&&kind!=="authored") return fail(training?"training opens an authored world: leave out archetype= and seed=":"planet= names an authored world: it cannot be combined with archetype= or seed=", {badPlanet:true, ...who});
  if(training&&scText!==null) return fail("training has no scenario: leave out scenario=", {badPlanet:true, ...who});
  if(training&&!(BLOOM_DATA.training&&BLOOM.play&&BLOOM.play.deriveConfig)) return fail("the training data (content/training.js) or BLOOM.play is not loaded", {badPlanet:true, ...who});
  // (BLOOM-033) an expedition= link is retired: expeditions start inside index.html and never cross a document (explicit failure, never First Bloom)
  if(q.get("expedition")!==null) return fail("expedition links are retired: an expedition starts inside index.html, from the Destination Survey, and never leaves it", {badPlanet:true, planetName:"Expedition link"});
  let scenario=null; // null = no scenario parameter: the default scenario, the engine exactly as before BLOOM-012
  if(scText!==null){
    if(!/^[a-z][a-z0-9_]{0,40}$/.test(scText)) return fail(`"scenario" must be a scenario id from content/scenarios.js (got "${scText}")`, {badScenario:true});
    try { scenario=BLOOM.pressure.resolveScenario(BLOOM_DATA.scenarios, scText); } catch(e){ return fail(e.message, {badScenario:true}); } }
  const withScenario=(run)=>{ // layer P for a scenario that changes the run (pressure and/or competition); the default adds nothing to prove
    const D0=BLOOM.pressure.resolveScenario(BLOOM_DATA.scenarios,null);
    run.scenario=scenario; run.summary.scenarioId=scenario?scenario.id:D0.id; run.summary.scenario=scenario?scenario.name:D0.name;
    if(!BLOOM.pressure.isDynamic(scenario)) return run;
    const v=BLOOM.validateScenario(run.planet, BLOOM_DATA.config, BLOOM_DATA.traits, scenario, {archetypeId:run.archetype?run.archetype.id:null});
    if(!v.ok) return fail(v.reason||`${scenario.name} ${v.status}`, {archetype:run.archetype&&run.archetype.name, planetName:run.planet.name, scenario:scenario.name, scenarioRejected:v.status});
    run.summary.scenarioValidation={status:v.status, strategiesProven:v.strategies.length, required:v.required}; // a count only — no builds, no plans
    return run; };
  if(kind==="authored"){
    const pid=planetText!==null?planetText:training?BLOOM_DATA.training.planetId:"first_bloom";
    const P=/^[a-z][a-z0-9_]{0,40}$/.test(pid)&&Object.prototype.hasOwnProperty.call(BLOOM_DATA.planets,pid)?BLOOM_DATA.planets[pid]:null;
    if(!P) return fail(`unknown planet "${pid}" (authored worlds: ${Object.keys(BLOOM_DATA.planets).join(", ")})`, {badPlanet:true, planetName:`planet ${pid}`});
    const run=withScenario({kind:"authored", planet:P, planetParam:planetText, summary:{kind:"authored", planetId:P.id, name:P.name}});
    if(training&&!run.failed){ // (BLOOM-033) the SAME training run descriptor the app builds (BLOOM.gameSession.trainingRun); the derived
      // config is built once, there; content/config.js is never edited. return= is this harness's own (where its exits navigate)
      const T=BLOOM.gameSession.trainingRun({planetId:P.id, returnTo:BLOOM.play.safeReturn(q.get("return"), location.href, BLOOM_DATA.training.returnTo)});
      run.play=true; run.summary.training=true; run.training=T.training; }
    return run; }
  const A=(BLOOM_DATA.archetypes||[]).find(a=>a.id===aid);
  if(!A) return fail(`unknown archetype "${aid}" (known: ${(BLOOM_DATA.archetypes||[]).map(a=>a.id).join(", ")})`);
  if(seedText===null||!/^\d{1,10}$/.test(seedText)||+seedText>4294967295) return fail(`"seed" must be a whole number 0–4294967295 (got ${seedText===null?"nothing":`"${seedText}"`})`);
  const seed=+seedText;
  let planet;
  try { planet=BLOOM.generateFromArchetype(A, seed, { config:BLOOM_DATA.config, traits:BLOOM_DATA.traits }); }
  catch(e){ if(!e.attempts) throw e;
    const byLayer={}; for(const a of e.attempts){ const m=(a.rejected[0]||"").match(/^layer (\d)/); const k=m?`layer ${m[1]}`:"structure / geography"; byLayer[k]=(byLayer[k]||0)+1; }
    return fail(`no acceptable world in ${e.attempts.length} attempts`, { archetype:A.name, attempts:e.attempts.length, rejectedByLayer:byLayer }); }
  // the player never sees validator solutions: drop the witness plan and strategy signatures before the UI starts
  BLOOM.play.stripPlanet(planet);
  return withScenario({kind:"procedural", planet, archetype:A, seed, summary:procSummary(A, planet)});
}
// (BLOOM-033) the historical engineering shell (developer harness only): instantiated from its <template> for ?ui=legacy and for the
// harness's own failure / no-world states (which write into its header and main); never on the production path
const SHELL_MODE=new URLSearchParams(location.search).get("ui")==="legacy";
function shell(){ if(document.getElementById("shellHeader")) return; const t=document.getElementById("shellTemplate"); document.body.insertBefore(t.content.cloneNode(true), t); }
// (BLOOM-033) the run's former page-level bindings, installed on window for the historical oracle suites (live accessors over the session)
function installDevGlobals(dev){ if(!dev) return; const skipped=[];
  for(const [k,d] of Object.entries(Object.getOwnPropertyDescriptors(dev))){ const own=Object.getOwnPropertyDescriptor(window,k);
    if(own&&!own.configurable){ skipped.push(k); continue; } Object.defineProperty(window,k,{get:d.get, set:d.set, configurable:true}); }
  window.BLOOM_HARNESS={ devGlobals:Object.keys(dev).length, skipped }; }
function startRun(run){
window.BLOOM_RUN=run;
if(BLOOM_RUN.kind==="missing"){
  document.body.innerHTML='<p style="padding:24px;font-family:monospace;color:#ff6b6b">BLOOM could not load its engine/content files. Open demos/demo-run.html from inside the full Bloom folder (it needs ../content, ../planets and ../resources).</p>';
} else if(BLOOM_RUN.failed){ // explicit failure state: identify the request, start nothing
  shell();
  const f=BLOOM_RUN.summary, esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const scen=f.badScenario||f.scenarioRejected, where=f.kind==="authored"?(f.planetName?esc(f.planetName):"First Bloom")
    :`${f.archetype?esc(f.archetype):`archetype <code>${esc(f.archetypeId)}</code>`} · public seed <code>${esc(f.seed)}</code>`;
  document.title=scen?"BLOOM — run not started":"BLOOM — generation failed"; document.querySelector("header h1 small").textContent=scen?"· run not started":"· generation failed";
  document.querySelector("main").innerHTML=`<div class="genfail" id="genFail" style="grid-column:1/-1;align-self:start"><h2>${scen?"NO RUN STARTED":"NO WORLD GENERATED"}</h2>
    <div>${where}${f.scenarioId!==null&&f.scenarioId!==undefined?` · scenario <code>${esc(f.scenarioId)}</code>`:""}</div>
    <p>${esc(f.why)}.${f.rejectedByLayer?` Rejected attempts: ${Object.entries(f.rejectedByLayer).map(([k,n])=>`${esc(k)} ${n}`).join(" · ")}.`:""}</p>
    <p style="color:var(--dim)">${f.scenarioRejected?`This planet + scenario combination did not pass the scenario validation layer (${esc(f.scenarioRejected)}). No other scenario or seed was substituted and no run was started.`
      :f.badPlanet?`No other world was substituted and no run was started.`
      :f.badScenario?`Known scenarios: ${(BLOOM_DATA.scenarios||[]).map(x=>`<code>${esc(x.id)}</code>`).join(", ")}. Leave <code>scenario=</code> out (or <code>scenario=default</code>) for the default scenario. No other scenario was substituted and no run was started.`
      :`${f.attempts?"This public seed is not playable under the current validation policy.":"The launch parameters are invalid."} No other seed was substituted and no world was started. Try a different <code>seed=</code> value.`}</p></div>`;
  document.querySelector("header .hud").style.visibility="hidden"; document.querySelector("header .controls").style.visibility="hidden";
  document.getElementById("log").textContent=scen?`Run not started (scenario ${f.scenarioId}).`:`Generation failed for public seed ${f.seed}.`;
  window.BLOOM_API={ run:f };
} else { // (BLOOM-033) the run: the SAME GameSession index.html creates (resources/run/game-session.js), from this harness's descriptor
  if(SHELL_MODE) shell();
  if(BLOOM_RUN.training){ // BLOOM-028D1: the training run opens under black (the title faded out into it). Its training layer (an ES
    // module) lifts it once the run is drawn and owns the exits; without that layer the black just goes
    const c=document.createElement("div"); c.id="trainingCover"; c.className="training-cover"; c.setAttribute("aria-hidden","true"); document.body.appendChild(c);
    setTimeout(()=>{ if(!c.dataset.owner) c.remove(); },2000); }
  const session=window.BLOOM_SESSION=BLOOM.gameSession.create(BLOOM_RUN, { host:document.body, shell:SHELL_MODE, debug:true });
  installDevGlobals(session.debug);
  // (BLOOM-031) over file:// the same module comes from the portable runtime (resources/portable/module-loader.js)
  if(BLOOM_RUN.training) BLOOM.modules.load(new URL("../resources/training/training-run.js",location.href).href)
    .then(m=>m.mountTraining(session)).catch(e=>console.warn("BLOOM: the training layer could not load",e&&e.message));
}
}
/* ========================================================================== */
/*  BLOOM-016 PLAYER PATH (?play=1&archetype=<id>&scenario=<id>[&seed=<n>]),  */
/*  a direct developer URL since BLOOM-030 (the BLOOM-016 launcher is        */
/*  retired; its exits go to the root title). Without a seed: a bounded      */
/*  search over                                                              */
/*  automatically chosen World Seeds (BLOOM.play.searchWorld: archetype      */
/*  layers 1–8, then layer P when the scenario changes the run) behind a     */
/*  "Preparing planet…" screen, in a worker when the browser allows it. With */
/*  a seed (Play again / a shared link): that seed only. The accepted world's */
/*  URL replaces the address (reload = the same world). Rejected candidates  */
/*  never start; no other planet or scenario is ever substituted.            */
/*  &candidates=a,b,c (QA hook) fixes the seed list; &avoid=<n> skips a seed. */
/*  ?play=1 alone = First Bloom through the harness path above, unchanged.   */
/* ========================================================================== */
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fill=(t,m)=>String(t).replace(/\{(\w+)\}/g,(_,k)=>m[k]!==undefined?m[k]:`{${k}}`);
window.BLOOM_PLAY_LOG={mode:null, steps:[], state:"idle"}; // QA: how the world search ran (never any solution data)
function playFail(P,{title,body,reason,A,S,retry}){
  shell();
  const brief="../index.html?begin=1"; // (BLOOM-030) "Change selection": the title's Destination Survey (the BLOOM-016 briefing is retired)
  document.title="BLOOM — no world started"; document.querySelector("header h1 small").textContent="";
  document.querySelector("header .hud").style.visibility="hidden"; document.querySelector("header .controls").style.visibility="hidden";
  const prep=document.getElementById("prep"); if(prep) prep.remove();
  document.querySelector("main").innerHTML=`<div class="playfail" id="playFail" role="alert" style="grid-column:1/-1;align-self:start"><h2>${esc(title)}</h2>
    <p>${esc(body)}</p>${reason?`<p style="color:var(--dim)">${esc(reason)}</p>`:""}
    ${retry?`<button type="button" id="failRetry" data-go="${retry}">${esc(P.failure.retry)}</button>`:""}
    <button type="button" id="failChange" data-go="${brief}">${esc(P.failure.change)}</button>
    <button type="button" id="failHome" data-go="../index.html">${esc(P.actions.home)}</button></div>`;
  document.querySelectorAll("#playFail button[data-go]").forEach(b=>b.addEventListener("click",()=>{ location.href=b.dataset.go; }));
  document.getElementById("log").textContent="No world started.";
  window.BLOOM_API={ run:{ failed:true, play:true, archetypeId:A?A.id:null, scenarioId:S?S.id:null, title } };
  (document.getElementById("failRetry")||document.getElementById("failChange")).focus();
}
function playBoot(q){
  const D=BLOOM_DATA, P=D.play, aid=q.get("archetype"), scText=q.get("scenario"), seedText=q.get("seed"), cand=q.get("candidates");
  const A=(D.archetypes||[]).find(a=>a.id===aid); let S=null;
  try { S=BLOOM.pressure.resolveScenario(D.scenarios, scText); } catch(e){ S=null; }
  const seedOk=t=>/^\d{1,10}$/.test(t)&&+t<=4294967295;
  if(!A||!S||(seedText!==null&&!seedOk(seedText))||(cand!==null&&!cand.split(",").every(seedOk)))
    return playFail(P,{title:P.failure.title, body:P.failure.badLink});
  const replay=seedText!==null, avoid=q.get("avoid");
  const rand=()=>crypto.getRandomValues(new Uint32Array(1))[0];
  const seeds=replay?[+seedText]:cand!==null?cand.split(",").map(Number):BLOOM.play.pickSeeds(P.search.maxCandidates, P.search, rand, avoid!==null&&seedOk(avoid)?+avoid:null);
  const names={planet:A.name, scenario:S.name}, L=P.loading;
  // the preparation screen (covers the inert run page until the world is ready)
  document.title=`BLOOM — ${P.loading.title}`;
  const prep=document.createElement("div"); prep.className="prep"; prep.id="prep"; prep.setAttribute("role","dialog"); prep.setAttribute("aria-modal","true"); prep.setAttribute("aria-labelledby","prepTitle");
  prep.innerHTML=`<div class="box"><h2 id="prepTitle">${esc(L.title)}</h2><div class="what" id="prepWhat">${esc(A.name)} · ${esc(S.name)}</div>
    <div class="stepline" aria-live="polite"><span class="spin" aria-hidden="true"></span><span id="prepStep">${esc(L.steps.terrain)}</span></div>
    <div class="slow" id="prepSlow"></div><button type="button" id="prepCancel">${esc(L.cancel)}</button></div>`;
  document.body.appendChild(prep); document.getElementById("prepCancel").focus();
  const LOG=window.BLOOM_PLAY_LOG; LOG.state="running"; LOG.seeds=seeds.length; let cancelled=false, stop=()=>{};
  const slowT=setTimeout(()=>{ const e=document.getElementById("prepSlow"); if(e) e.textContent=L.slowNote; },4000);
  document.getElementById("prepCancel").addEventListener("click",()=>{ cancelled=true; stop(); LOG.state="cancelled"; clearTimeout(slowT);
    location.href="../index.html"; }); // (BLOOM-030) back to the Strange Bloom title (the BLOOM-016 briefing is retired)
  const onStep=st=>{ if(cancelled) return; LOG.steps.push({step:st.step, index:st.index});
    const e=document.getElementById("prepStep"); if(e) e.textContent=fill(L.steps[st.step]||L.title, names); };
  const args={archetypeId:A.id, scenarioId:S.id, seeds};
  // main-thread fallback (file:// pages cannot start workers): the same generator, one step per task so the screen repaints
  const searchHere=()=>new Promise((resolve,reject)=>{ LOG.mode="main";
    const it=BLOOM.play.searchWorld({archetype:A, scenario:S, seeds, config:D.config, traits:D.traits});
    const next=()=>{ if(cancelled) return; let r; try { r=it.next(); } catch(e){ return reject(e); }
      if(r.done) return resolve(r.value); onStep(r.value); setTimeout(next,30); };
    setTimeout(next,30); });
  const searchWorker=()=>new Promise((resolve,reject)=>{ let w, heard=false;
    try { w=new Worker("../resources/bloom-play-worker.js"); } catch(e){ return searchHere().then(resolve,reject); }
    LOG.mode="worker"; stop=()=>w.terminate();
    w.onmessage=e=>{ heard=true; const m=e.data;
      if(m.type==="step") onStep(m.step); else { w.terminate(); m.type==="done"?resolve(m.result):reject(new Error(m.message)); } };
    w.onerror=ev=>{ ev.preventDefault(); w.terminate(); if(!heard) searchHere().then(resolve,reject); else reject(new Error(ev.message||"world search failed")); };
    w.postMessage(args); });
  searchWorker().then(res=>{ clearTimeout(slowT); if(cancelled) return; LOG.state=res.ok?"accepted":"failed"; LOG.tried=res.tried.map(t=>({seed:t.seed, outcome:t.outcome}));
    if(!res.ok) return playFail(P,{title:P.failure.title, A, S, retry:"demo-run.html?"+BLOOM.play.runQuery({archetype:A.id, scenario:S.id}),
      body:fill(replay?P.failure.replayBody:P.failure.body, names), reason:res.status==="DISALLOWED"?res.reason:null});
    const planet=res.planet, run={kind:"procedural", play:true, planet, archetype:A, seed:res.seed, scenario:S,
      summary:{...procSummary(A, planet), scenarioId:S.id, scenario:S.name}};
    if(res.scenarioValidation) run.summary.scenarioValidation=res.scenarioValidation; // a count only — no builds, no plans
    history.replaceState(null, "", location.pathname+"?"+BLOOM.play.runQuery({archetype:A.id, seed:res.seed, scenario:S.id}));
    prep.remove(); startRun(run);
  }, err=>{ clearTimeout(slowT); LOG.state="error"; LOG.error=String(err&&err.message||err);
    playFail(P,{title:P.failure.title, body:fill(P.failure.body, names), A, S, retry:"demo-run.html?"+BLOOM.play.runQuery({archetype:A.id, scenario:S.id})}); });
}
{ const q=new URLSearchParams(location.search), play=q.get("play")==="1";
  if(!(window.BLOOM&&BLOOM.gameSession)) startRun({kind:"missing"});
  else if(play&&q.get("archetype")!==null&&q.get("expedition")===null&&BLOOM.play&&window.BLOOM_DATA&&BLOOM_DATA.play) playBoot(q);
  else { const run=harnessRun(); if(play&&!run.failed&&run.kind!=="missing") run.play=true; startRun(run); } }
</script>

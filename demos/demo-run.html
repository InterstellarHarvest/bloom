<title>BLOOM — Next Playable Slice: First Bloom (Eden run)</title>
<!--
  BLOOM demo-run.html — the "Next Playable Slice" (bible v1.1 + docs/NEXT_PLAYABLE_SLICE_v1.0.md).
  ONE complete Eden run on an authored 9-section planet, proving the core loop:
     see barrier → buy answer → watch spread resume → earn faster → solve tradeoff → win 70%.
  Includes: sim tick (Barren/Living/Dead, vigor, hysteresis, damped die-back, recovery),
  4-category readout (Temperature/Water/Soil/Hazard) + named limiting factor + raw-on-click,
  passive Biomass + bonus bubbles (auto-collect fallback), a temporary Spread/Adapt/Terraform
  upgrade set, 70%-coverage win + a compact Bloom Report.
  Temporary UI / dark scaffolding is intentional (final art deferred). Boots over file://.
  2026-09-26 tuning pass: ~6–8 min pacing, hover/focus purchase preview (regions opened/closed),
  Bloom Report names the regions your build gave up + a real-plant analog per adaptation + a drawn plant.
  BLOOM-002 (2026-09-26): this file is now UI + rendering only. The simulation is resources/bloom-sim.js,
  numbers are content/config.js, upgrades are content/traits.js, the planet is planets/first_bloom.js.
  Test hook: window.BLOOM_API = { buy, sim, advance, coverage, state } for headless checks.
  Headless QA: tools/slice-check.js (drives the real buttons) · tools/sim-check.js (engine golden, Node).
  BLOOM-007 (developer/playtest harness, NOT the planet menu): with no query string this is First Bloom,
  unchanged. demo-run.html?archetype=ocean_archipelago&seed=13 generates that public seed through the real
  BLOOM.generateFromArchetype production path (validator layers 1–8) and plays it with the same UI; a seed
  that fails generation shows an explicit failure state (never another seed). QA: tools/procedural-run-check.js.
  BLOOM-008 (temporary UI, not final): Colony Focus in the inspect panel (Roots / Leaves / Seeds on ONE Living region,
  set-and-leave), an ordinary-language colony status (Sparse → Establishing → Established → Dense), and map vegetation
  shaded by each tile's stand density (light, gappy seedlings → dark, full stands).
  BLOOM-009 (temporary UI, not final): EVERY Living region keeps its own growth focus (Balanced / Roots / Leaves / Seeds) and
  may buy ONE local upgrade (Root Network / Leaf Canopy / Seed Reserve) with Biomass; small map badges show each region's
  focus + upgrade; Biomass is the dominant HUD element; seedlings start tiny; Waterborne crossings show seeds travelling
  over water (pale ripple = seeds arrived, bright burst = they took root). QA: tools/colony-development-check.js.
  BLOOM-010: the same launch path plays the second archetype (?archetype=desert_world&seed=25). An archetype may carry
  a tiny temporary map treatment as data (archetype.render: ground tint, water colours, dune stipple); water-crossing
  wording in the colony panel appears only where a crossing trait is offered. QA: tools/desert-check.js.
  BLOOM-011: the third archetype (?archetype=frozen_world&seed=22). render.tintBy "cold" + frost glints (data); the inspect
  panel shows the region's ground temperature, the sky and the plant's temperature range in °C, and notes geothermal ground;
  a Terraform preview / purchase names every region the new sky opens, moves closer (still blocked), makes worse or closes,
  outlines them for a few seconds and shows the change next to the HUD sky (temporary functional readouts, not the
  specimen/environment panel). QA: tools/frozen-check.js.
  BLOOM-012 (temporary functional UI, not the final layout): pressure scenarios. &scenario=<id> picks a scenario from
  content/scenarios.js independently of the planet (no parameter = Eden = everything above, unchanged; an unknown id is an
  explicit failure, never a substitute). A pressured run is started only if the planet + scenario pass the scenario
  validation layer (resources/bloom-scenario.js). It adds a full-width pressure bar under the HUD (scenario identity, phase,
  progress + time to the next stage, the live drift per channel and the sky as base + Terraform + scenario drift = now),
  a faint haze over the map that thickens with the decline, milestone messages at the scenario's phase thresholds, short
  outlines + messages when a living region tips toward its limit, the drift in the inspect panel, an extinction screen
  (with restart) and the scenario's final state in the Bloom Report. QA: tools/dying-world-check.js.
  BLOOM-014 (temporary functional UI, not the final layout): competition scenarios (any scenario with a `competition` block,
  launched with &scenario=<id>). Native vegetation is drawn from the engine's real tile state (sim.competition.native) as a
  hatched violet stand that thickens with its density; amber lines mark the fronts where it touches the player's plants. The
  inspect panel adds a short competition readout (who has the advantage here and why, in plain words); a slim status bar under
  the HUD shows native-held land, its trend and the contested regions (no clock: there is none); engine events (first contact,
  your advantage, native retakes, native-dominated region) become messages + short outlines; Terraform previews also say where
  the new sky suits the native plants more or less; the Bloom Report adds one competition line. QA: tools/native-competition-check.js.
  BLOOM-015 (temporary functional UI, not the final layout): climate-instability scenarios (any scenario with a
  `climateInstability` block). A slim status bar under the HUD shows the engine's live instability (sim.climate): overall %
  and band on a meter with the shock threshold marked, each sky axis's own instability, an announced or active shock (kind,
  size, time left), a one-line forecast, and the sky as base + Terraform + shock = now (never a countdown: there is no
  clock). Terraform previews / purchases add the instability change (axis, % before → after, band change) and warn when the
  step will set off a shock (likely kind and size). During a shock the map takes a faint tint of its kind and the ground
  colours follow the shocked sky; regions it pushes across a threshold (or that reopen when it ends) get a message + short
  outline; the inspect panel shows the shock in the region's temperature line. The Bloom Report and the extinction screen
  add one climate line. QA: tools/volatile-climate-check.js.
  BLOOM-016 (temporary shell, not the final layout): player mode, ?play=1, opened by the player entry point (../index.html).
  With an archetype but no seed it shows "Preparing planet…" and runs BLOOM.play.searchWorld (resources/bloom-play.js) over
  automatically chosen World Seeds (in resources/bloom-play-worker.js when the browser allows a worker; on file:// on the page,
  one step per task), starts the first world that passes layers 1–8 (+ layer P for a dynamic scenario), and writes
  ?play=1&archetype=…&seed=…&scenario=… into the address. A rejected candidate never starts; all rejected → a friendly
  "No playable world found" screen, never a substitute. Player wording (World Seed), a header Menu (Play this world again ·
  Same planet, new world · Change scenario · Change planet · Home; confirms before leaving a live run) and the same actions
  under the Bloom Report / extinction screen. Every action opens a fresh page. Without play=1 nothing here changes: the
  developer harness above is untouched. QA: tools/game-flow-check.js.
  BLOOM-028D1 (training foundation; no coaching UI yet): ?planet=<id> opens any AUTHORED world by id (BLOOM_DATA.planets; no
  planet= = First Bloom, exactly as before). ?training=1 is the training run, opened by the title's TRAINING: the authored
  Training Grounds (planets/training_grounds.js; content/training.js), PAUSED at the landing, on a config derived for it
  (BLOOM.play.deriveConfig — the shared config is never touched) with a seeded random stream; the run menu and the report offer
  Restart training · Skip training · Main menu, and &return=<url> (same origin only) is where they go. The training layer
  (resources/training/training-run.js, loaded in training mode only) fades the arrival / exits and records the training status.
  For every run: generic bloom:* events on document at the real action points (play-pause, speed, region-select,
  upgrade-preview, upgrade-purchase, growth-focus, local-upgrade, bubble-collect, win, run-ready), stable data-tutorial anchors
  on the controls, and BLOOM_RUN_UI.placeBubble(sectionId) for a bonus bubble placed on purpose. Contracts:
  docs/TRAINING_FOUNDATION_v1.md. QA: tools/training-check.js.
-->
<style>
  :root{
    --bg:#0b0e14; --panel:#121826; --panel2:#0e1320; --ink:#cdd6e6; --dim:#7c8aa3;
    --line:#26304a; --accent:#7fe3c0; --gold:#ffd479; --bad:#ff6b6b; --ok:#7fe3a0; --warn:#ffcf6b;
    --green:#66d17f; --yellow:#e7c14e; --red:#e2604f; --focus:#f59ad8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--ink); font-family:"DejaVu Sans Mono","Courier New",monospace;
    font-size:13px; line-height:1.45; display:grid; grid-template-rows:auto 1fr auto; height:100vh; overflow:hidden}
  header{display:flex; align-items:center; gap:16px; padding:8px 16px; flex-wrap:wrap;
    background:linear-gradient(180deg,#141b2c,#0e1320); border-bottom:1px solid var(--line)}
  header h1{font-size:13px; margin:0; letter-spacing:2px; color:var(--accent); white-space:nowrap}
  header h1 small{color:var(--dim); letter-spacing:1px; font-weight:normal}
  .hud{display:flex; gap:16px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--dim)}
  .hud b{color:var(--ink)}
  /* BLOOM-009: Biomass is the primary currency, so it is the largest thing in the HUD */
  .bio{position:relative; display:flex; align-items:center; gap:10px; padding:4px 14px 4px 8px; border-radius:26px; background:linear-gradient(180deg,#3a2c0c,#241a06);
    border:2px solid #8a6a22; box-shadow:0 0 0 1px #000 inset; min-width:190px; transition:box-shadow .25s, border-color .25s}
  .bio .leaf{width:30px; height:30px; flex:0 0 auto; background:radial-gradient(circle at 35% 30%,#ffe9a8,#e9b43a 60%,#9b6a12); border-radius:0 70% 0 70%; transform:rotate(-12deg); box-shadow:0 0 6px rgba(255,212,121,.45)}
  .bio .bnum{display:flex; flex-direction:column; line-height:1}
  .bio .blbl{font-size:10px; letter-spacing:2px; color:#caa55a}
  .bio b#hBio{font-size:30px; color:var(--gold); font-weight:700; letter-spacing:1px; font-variant-numeric:tabular-nums}
  .bio .brate{font-size:11px; color:#caa55a; margin-left:auto; white-space:nowrap}
  .bio.up{border-color:#ffe08a; box-shadow:0 0 14px rgba(255,212,121,.75)}
  .bio.down{border-color:#e2604f; box-shadow:0 0 14px rgba(226,96,79,.7)}
  .bio .spend{position:absolute; right:14px; top:-4px; color:#ff8b7a; font-weight:700; font-size:16px; pointer-events:none; animation:floatUp 1.1s ease-out forwards}
  @keyframes floatUp{from{opacity:1; transform:translateY(0)} to{opacity:0; transform:translateY(-18px)}}
  .covwrap{display:flex; align-items:center; gap:8px}
  .covbar{position:relative; width:200px; height:14px; background:#0a1220; border:1px solid var(--line); border-radius:7px; overflow:hidden}
  .covfill{position:absolute; left:0; top:0; bottom:0; width:0%; background:linear-gradient(90deg,#3f8f63,#66d17f); transition:width .2s}
  .covwin{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--gold)}
  .skyd{color:var(--gold); font-weight:700} /* BLOOM-011: the sky's last Terraform change, shown for a few seconds */
  .tline{margin:-4px 0 8px; padding:0 8px; font-size:11px; color:var(--dim)} .tline b{color:var(--ink); font-weight:600}
  .therm{margin:8px 0; padding:8px; border-radius:5px; background:#2a1a12; border:1px solid #6a3f22; color:#f0c49a; font-size:11px}
  .controls{margin-left:auto; display:flex; gap:8px; align-items:center}
  button{font:inherit; cursor:pointer}
  button.tb{background:#1a2236; color:var(--ink); border:1px solid var(--line); padding:5px 10px; font-size:12px; border-radius:4px}
  button.tb[aria-pressed="true"]{background:#23406a; border-color:var(--accent); color:#fff}
  button.tb:hover{border-color:var(--accent)}

  main{display:grid; grid-template-columns:290px 1fr 240px; min-height:0}
  .stage{position:relative; display:flex; align-items:center; justify-content:center; padding:12px; min-height:0; overflow:hidden}
  canvas{background:#05070c; border:1px solid var(--line); border-radius:3px; image-rendering:pixelated; cursor:crosshair; max-width:100%; max-height:100%}
  aside{background:var(--panel); overflow:auto; padding:12px; font-size:12px}
  aside.left{border-right:1px solid var(--line)}
  aside.right{border-left:1px solid var(--line)}
  aside h2{font-size:11px; letter-spacing:2px; color:var(--gold); margin:0 0 8px}
  .secname{font-size:15px; color:#fff; letter-spacing:1px; margin-bottom:2px}
  .badge{display:inline-block; padding:1px 6px; border-radius:3px; font-size:10px; letter-spacing:1px;
    background:#3a2a12; color:var(--gold); border:1px solid #6a4d1c; margin-left:6px}

  .cats{margin:10px 0}
  .cat{display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:5px; margin-bottom:5px; background:#0e1524; border:1px solid #1b2439}
  .cat .lamp{width:11px; height:11px; border-radius:50%; flex:0 0 auto}
  .cat .lbl{color:var(--dim); width:80px; flex:0 0 auto}
  .cat .tag{margin-left:auto; color:var(--dim); font-size:9px; white-space:nowrap}
  .cat .st{color:var(--ink); font-weight:600}
  .lamp.green{background:var(--green)} .lamp.yellow{background:var(--yellow)} .lamp.red{background:var(--red)}
  .limit{margin:8px 0; padding:8px; border-radius:5px; background:#241a12; border:1px solid #55401f; color:var(--gold)}
  .limit.ok{background:#132417; border-color:#2c5335; color:var(--ok)}
  .fixhint{font-size:11px; color:var(--dim); margin-top:4px}
  details.raw{margin-top:8px} details.raw summary{cursor:pointer; color:var(--dim); font-size:11px}
  table.kv{width:100%; border-collapse:collapse; margin-top:6px} table.kv td{padding:2px 4px; border-bottom:1px solid #1a2236}
  table.kv td:first-child{color:var(--dim)} table.kv td:last-child{text-align:right}
  .vitals{margin-top:10px; font-size:11px}
  .vbar{display:flex; height:12px; border:1px solid var(--line); border-radius:3px; overflow:hidden; margin-top:3px}
  .vbar i{display:block} .vbar .vl{background:#4c9e63} .vbar .vd{background:#6b4a33} .vbar .vb{background:#1a2436}

  .shop .grp{margin-bottom:12px}
  .shop .grp h3{font-size:11px; letter-spacing:1px; margin:0 0 6px; color:var(--accent); text-transform:uppercase}
  .buy{display:flex; align-items:center; justify-content:space-between; gap:6px; width:100%; text-align:left;
    background:#141d30; border:1px solid #22304d; color:var(--ink); padding:6px 8px; border-radius:5px; margin-bottom:5px; font-size:12px}
  .buy:hover:not(.off){border-color:var(--accent)}
  .buy.off{opacity:.42; cursor:default} /* not [disabled]: unaffordable upgrades must still hover-preview */
  .buy .nm{display:flex; flex-direction:column}
  .buy .nm small{color:var(--dim); font-size:10px}
  .buy .cost{color:var(--gold); white-space:nowrap}
  .buy.poor .cost{color:#ff8b7a} /* can't afford it yet: the price turns red */
  .buy.owned{border-color:#2c5335; background:#122017}
  .temppool{font-size:11px; color:var(--dim); margin-bottom:6px}

  footer{border-top:1px solid var(--line); background:var(--panel2); padding:6px 16px; font-size:11px; color:var(--dim);
    display:flex; gap:20px; align-items:center; overflow-x:auto; white-space:nowrap}
  .log{color:var(--ink)}

  .modal{position:fixed; inset:0; background:rgba(4,6,12,.82); display:none; align-items:center; justify-content:center; z-index:20}
  .modal.on{display:flex}
  .report{width:min(560px,92vw); max-height:88vh; overflow:auto; background:#111a2b; border:1px solid #2c3f63; border-radius:10px; padding:22px}
  .report h2{color:var(--gold); letter-spacing:2px; margin:0 0 4px}
  .report .sub{color:var(--dim); margin-bottom:14px}
  .report .debrief{background:#0e1626; border:1px solid #22304d; border-radius:6px; padding:12px; margin:12px 0; line-height:1.6}
  .report ul{margin:8px 0 0; padding-left:18px} .report li{margin:3px 0}
  .report .top{display:flex; gap:16px; align-items:flex-start}
  .report canvas#plantCv{flex:0 0 auto; background:#0b1322; border:1px solid #22304d; border-radius:6px; cursor:default}
  .report .analog li{margin:5px 0} .report .analog b{color:var(--accent)}
  .report .btn{margin-top:14px; background:#243b2f; border:1px solid #2f6a4d; color:#cdeede; padding:8px 16px; border-radius:6px}
  /* BLOOM-007 procedural harness: run identity, water / island notes, generation failure */
  .runid{margin-left:auto; color:#5d6a82; font-size:10px}
  .geo{margin:8px 0; padding:8px; border-radius:5px; background:#0f1d2c; border:1px solid #24435f; color:#9cc8e8; font-size:11px}
  .genfail{max-width:640px; margin:40px auto; padding:22px; background:#1f1418; border:1px solid #6a2f36; border-radius:10px; line-height:1.6}
  .genfail h2{color:var(--bad); letter-spacing:2px; margin:0 0 8px; font-size:14px}
  .genfail code{color:var(--gold)}
  /* BLOOM-008: colony status + Colony Focus (temporary inspect-panel control) */
  .colony{margin:8px 0; padding:8px; border-radius:5px; background:#0f1a14; border:1px solid #24452f}
  .colony .cw{color:#fff; font-weight:600}
  .dbar{height:8px; border:1px solid var(--line); border-radius:3px; margin-top:4px; background:#1a2436; overflow:hidden}
  .dbar i{display:block; height:100%; background:linear-gradient(90deg,#b2d678,#227a38)}
  /* BLOOM-009: per-region growth focus + local upgrade (temporary inspect-panel controls) */
  .focus{margin:8px 0; padding:10px; border-radius:8px; background:#1a1422; border:1px solid #4a3160}
  .focus h3{font-size:12px; letter-spacing:1px; margin:0 0 4px; color:var(--focus)}
  .focus .fnote{font-size:11px; color:var(--dim); margin-bottom:6px}
  .fgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px}
  .fbtn{display:flex; flex-direction:column; align-items:flex-start; text-align:left; background:#211a2e; border:2px solid #3d2d52; color:var(--ink);
    padding:8px 9px; border-radius:8px; font-size:14px; min-height:54px}
  .fbtn .fi{font-size:16px; margin-right:4px}
  .fbtn small{color:var(--dim); font-size:10px; margin-top:2px}
  .fbtn:hover:not(.off){border-color:var(--focus)}
  .fbtn[aria-pressed="true"]{background:#3a2350; border-color:var(--focus); color:#fff}
  .fbtn.off{opacity:.42; cursor:default}
  .fstate{font-size:11px; color:var(--focus); margin:6px 0 2px}
  .ftip{font-size:11px; color:#b9d9a0; margin:4px 0 0}
  .local{margin-top:10px; padding-top:8px; border-top:1px dashed #4a3160}
  .local h3{color:var(--gold)}
  .sbtn{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; text-align:left; background:#241d10; border:2px solid #5b4520;
    color:var(--ink); padding:7px 9px; border-radius:8px; margin-bottom:5px; font-size:13px; min-height:46px}
  .sbtn small{display:block; color:var(--dim); font-size:10px}
  .sbtn .scost{display:flex; align-items:center; gap:4px; color:var(--gold); font-weight:700; font-size:15px; white-space:nowrap}
  .sbtn .scost i{width:12px; height:12px; background:radial-gradient(circle at 35% 30%,#ffe9a8,#e9b43a 60%,#9b6a12); border-radius:0 70% 0 70%; display:inline-block}
  .sbtn:hover:not(.off){border-color:var(--gold)}
  .sbtn.off{opacity:.55; cursor:default}
  .sbtn.poor .scost{color:#ff8b7a}
  .sbtn .need{display:block; font-size:10px; color:#ff8b7a; font-weight:normal}
  .owned{padding:8px; border-radius:8px; background:#2a2410; border:2px solid #8a6a22; color:#ffe7a8; font-size:13px}
  .owned small{display:block; color:#caa55a; font-size:10px; margin-top:2px}
  /* BLOOM-012: temporary pressure bar (full width under the HUD; only on pressure scenarios) + extinction screen */
  .pbar{flex:1 0 100%; display:flex; flex-direction:column; gap:6px; padding:8px 12px; margin:2px 0 0; border-radius:8px;
    background:linear-gradient(180deg,#1f1830,#17122a); border:1px solid #4b3b6e; font-size:14px; color:#e4dcf5; transition:box-shadow .3s, border-color .3s}
  .pbar.pulse{border-color:#ffb36b; box-shadow:0 0 18px rgba(255,179,107,.65)}
  .pbar .prow{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .pbar .pid{font-weight:700; letter-spacing:1px; color:#ffcf9a; font-size:15px; white-space:nowrap}
  .pbar .pphase{font-weight:700; color:#fff; white-space:nowrap}
  .pbar .ptrack{position:relative; flex:1 1 220px; min-width:180px; height:16px; border-radius:8px; background:#0c0a16; border:1px solid #3c3058; overflow:hidden}
  .pbar .pfill{position:absolute; left:0; top:0; bottom:0; width:0%; background:linear-gradient(90deg,#7d6bb0,#e0805a)}
  .pbar .ptick{position:absolute; top:0; bottom:0; width:2px; background:rgba(255,255,255,.55)}
  .pbar .pnext{color:#c9bde6; white-space:nowrap}
  .pbar .chip{display:inline-block; padding:2px 9px; border-radius:12px; background:#2c2244; border:1px solid #57447e; white-space:nowrap}
  .pbar .chip b{color:#ffcf9a} .pbar .psky{color:#c9bde6; font-size:13px} .pbar .psky b{color:#fff}
  .pbar .pwarn{color:#ff8b7a; font-weight:700}
  .press{margin:8px 0; padding:8px; border-radius:5px; background:#1d1630; border:1px solid #4b3b6e; color:#d9cff0; font-size:11px}
  .press b{color:#ffcf9a}
  .report.lost h2{color:var(--bad)}
  /* BLOOM-014: competition (temporary): status bar under the HUD, inspect readout, report line */
  .cbar{flex:1 0 100%; display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:6px 12px; margin:2px 0 0; border-radius:8px;
    background:linear-gradient(180deg,#22172c,#1a1224); border:1px solid #5a3f72; font-size:14px; color:#eadcf5; transition:box-shadow .3s, border-color .3s}
  .cbar.pulse{border-color:#ffb347; box-shadow:0 0 16px rgba(255,179,71,.6)}
  .cbar .cid{font-weight:700; letter-spacing:1px; color:#d9b3f0; white-space:nowrap}
  .cbar b{color:#fff} .cbar .ctrend{font-weight:700; white-space:nowrap} .cbar .up{color:#e8a0ff} .cbar .dn{color:#9fe3a0} .cbar .flat{color:#b9a8cc}
  .cbar .key{margin-left:auto; color:#b9a8cc; font-size:12px; white-space:nowrap}
  .cbar .sw{display:inline-block; width:14px; height:14px; vertical-align:-2px; border-radius:2px; margin-right:4px;
    background:repeating-linear-gradient(135deg,#7a4ea0 0 3px,#b892d6 3px 5px)}

<script type="text/plain" id="bloomUI">

/*  ENGINE WIRING — simulation lives in resources/bloom-sim.js; numbers in    */

// BLOOM-028D1: a training run (?training=1) plays on its own derived config (content/training.js through BLOOM.play.deriveConfig:

const {clamp}=BLOOM.util;
const mix=(c1,c2,k)=>[c1[0]+(c2[0]-c1[0])*k,c1[1]+(c2[1]-c1[1])*k,c1[2]+(c2[2]-c1[2])*k];

// opens a fresh page (a new run is genuinely new: nothing of this sim carries over); the developer harness never shows them.

    ...(sim.won?[]:[{id:"skipTraining", label:TC.skip, note:TC.skipNote}]), {id:"mainMenu", label:TC.mainMenu, note:TC.mainMenuNote, primary:sim.won}];
  if(!RUN_ARCH) return [{id:"playAgain", label:X.playAgain, href:"demo-run.html?play=1"+AUTH_Q, primary:true},
    {id:"changePlanet", label:PC.choose.action, href:"../index.html#/planet"}, {id:"home", label:X.home, href:"../index.html"}];
  return [{id:"playAgain", label:X.playAgain, note:X.playAgainNote, href:"demo-run.html?"+q({archetype:RUN_ARCH, seed:BLOOM_RUN.seed, scenario:RUN_SCN}), primary:true},
    {id:"newWorld", label:X.newWorld, href:"demo-run.html?"+q({archetype:RUN_ARCH, scenario:RUN_SCN})+"&avoid="+BLOOM_RUN.seed},
    {id:"changeScenario", label:X.changeScenario, href:"../index.html#/scenario/"+RUN_ARCH},
    {id:"changePlanet", label:X.changePlanet, href:"../index.html#/planet/"+RUN_ARCH},

const actBtn=a=>`<button type="button" data-act="${a.id}" data-go="${a.href||""}" data-tutorial="action-${a.id}"${a.primary?' class="primary"':""}>${a.label}${a.note?`<small>${a.note}</small>`:""}</button>`;

// leaving a live run asks first (it is not saved); after a win or an extinction it just goes
function wireActions(el){ el.querySelectorAll("button[data-go]").forEach(b=>b.addEventListener("click",()=>{
  if(TRAIN) return trainingGo(b.dataset.act); // (BLOOM-028D1) nothing to lose in training: no confirm

  Water:e=>e.cats.Water.word==="parched"||e.cats.Water.word==="dry"?"too dry":"too wet",
  Soil:e=>e.cats.Soil.word==="hostile"?"soil is hostile (salt/pH)":"soil is marginal (salt/pH)",
  Hazard:e=>e.cats.Hazard.word==="lethal"?"hazard is lethal":"hazard is stressful" };
const FIX_HINT={ Temperature:e=> (e.cats.Temperature.word==="freezing"||e.cats.Temperature.word==="cold")
    ? "Adapt: Cold Tolerance — or Terraform: Warm the sky"
    : "Adapt: Heat Tolerance — or Terraform: Cool the sky",
  Water:e=> (e.cats.Water.word==="parched"||e.cats.Water.word==="dry")
    ? "Adapt: Drought — or Terraform: Humidify"
    : "Adapt: Flood — or Terraform: Dry the sky",
  Soil:e=> "Adapt: Salt Handling (must evolve — not terraformable)",
  Hazard:e=> e.cats.Hazard.word==="lethal" ? "Adapt: Radiation Shielding (toxicity here has no cure yet — may be a sacrifice zone)" : "Radiation Shielding reduces this." };

/* ========================================================================== */
/*  RENDER                                                                     */
/* ========================================================================== */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
let TILE=14, selected=-1, selectedWater=false, rawOpen=false, preview=null; // preview={gain:[],lose:[],reachHostile?}
const TEMP_STOPS=[[-40,[44,62,104]],[-20,[78,104,140]],[0,[100,126,116]],[12,[92,140,88]],[25,[156,146,84]],[40,[182,100,60]],[60,[150,58,46]]];
function stops(v){ const S=TEMP_STOPS; if(v<=S[0][0])return S[0][1].slice(); if(v>=S[S.length-1][0])return S[S.length-1][1].slice();
  for(let i=0;i<S.length-1;i++){const[a,ca]=S[i],[b,cb]=S[i+1]; if(v>=a&&v<=b)return mix(ca,cb,(v-a)/(b-a));} return S[0][1].slice(); }

// into bare ground, its own water colours and a faint dune stipple. Worlds without it (First Bloom, Ocean) draw as before.
const RENDER=(BLOOM_RUN.kind==="procedural"&&BLOOM_RUN.archetype.render)||null;

const TINT_COLD=!!(RENDER&&RENDER.tintBy==="cold"), FROST_BELOW=-8;
const coldWeight=t=>clamp((4-t)/24,0.12,1);
// (BLOOM-012: drawn from the sky every region sees now — under pressure that includes the scenario drift, so the map dries
// and cools with the decline; without pressure it is exactly the player's sky, as before)
let DRAW_T=0, DRAW_M=0;
function barrenColor(i){ const L=SEC[i].local, t=DRAW_T+L.tempOffset; let c=stops(t);
  const m=DRAW_M+L.moistureOffset; if(m<35)c=mix(c,[150,138,104],0.4); else if(m>68)c=mix(c,[64,104,104],0.35);

const SPARSE_C=[190,222,120], DENSE_C=[24,104,46], SICK_C=[128,122,70];
function livingColor(d,v){ const c=mix(SPARSE_C,DENSE_C,Math.pow(clamp(d,0,1),0.75));
  return mix(SICK_C,c,clamp((v-0.2)/0.5,0,1)); }

const patchFrac=d=>0.24+0.76*Math.pow(clamp((d-0.03)/(DFULL-0.03),0,1),0.8); // share of the tile side the patch covers
// small fixed per-tile offset so young patches sit irregularly (organic) rather than in a perfect grid; 0 once full
const JIT=new Float32Array(N*2); for(let i=0;i<N;i++){ const h=Math.imul(i^0x9e3779b9,0x85ebca6b)>>>0; JIT[2*i]=((h&255)/255-0.5)*0.8; JIT[2*i+1]=(((h>>8)&255)/255-0.5)*0.8; }

      const sz=TILE*f, o=(TILE-sz)/2, ox=o*JIT[2*i], oy=o*JIT[2*i+1]; ctx.fillStyle=rgb(livingColor(dens[i],vigor[s]));
      ctx.fillRect(x*TILE+o+ox,y*TILE+o+oy,sz+(f<1?0:.5),sz+(f<1?0:.5)); continue; }
    else if(state[i]===DEAD) c=DEAD_C;
    else if(COMP&&CS.native[i]>0){ const d=CS.native[i]; ctx.fillStyle=rgb(mix(barrenColor(s),nativeColor(d),0.45+0.55*clamp(d/0.8,0,1)));
      ctx.fillRect(x*TILE,y*TILE,TILE+.5,TILE+.5); natHatch.push(x,y,d); continue; }
    else c=barrenColor(s);
    ctx.fillStyle=rgb(c); ctx.fillRect(x*TILE,y*TILE,TILE+.5,TILE+.5);
    if(DUNE&&state[i]===BAR&&duneAt(x,y)){ ctx.fillStyle=rgb(mix(c,[236,206,150],0.35)); ctx.fillRect(x*TILE+TILE*.15,y*TILE+TILE*.55,TILE*.7,Math.max(1,TILE*.14)); } // a wind ripple
    if(FROST&&state[i]===BAR&&s>=0&&frosty[s]&&frostAt(x,y)){ const g=Math.max(1,TILE*.16); ctx.fillStyle=rgb(mix(c,[236,244,255],0.6)); // a small ice glint
      ctx.fillRect(x*TILE+TILE*.3,y*TILE+TILE*.3,g,g); ctx.fillRect(x*TILE+TILE*.3+g,y*TILE+TILE*.3+g,g,g); ctx.fillRect(x*TILE+TILE*.62,y*TILE+TILE*.62,g,g); }
  }
  if(natHatch.length){ ctx.strokeStyle=NAT_HATCH; ctx.lineWidth=Math.max(1,TILE*0.12); ctx.beginPath(); // "/" marks: one on a young stand, two on a dense one
    for(let k=0;k<natHatch.length;k+=3){ const x=natHatch[k]*TILE, y=natHatch[k+1]*TILE, d=natHatch[k+2];
      if(d>0.45){ ctx.moveTo(x+TILE*0.12,y+TILE*0.55); ctx.lineTo(x+TILE*0.55,y+TILE*0.12); ctx.moveTo(x+TILE*0.45,y+TILE*0.88); ctx.lineTo(x+TILE*0.88,y+TILE*0.45); }
      else { ctx.moveTo(x+TILE*0.25,y+TILE*0.75); ctx.lineTo(x+TILE*0.75,y+TILE*0.25); } }
    ctx.stroke(); }
  // BLOOM-012: a faint haze over the whole map that thickens as the atmosphere thins (temporary feedback, not weather art)
  if(PRESS&&PS.progress>0){ ctx.fillStyle=`rgba(200,182,226,${(0.22*PS.progress).toFixed(3)})`; ctx.fillRect(0,0,W*TILE,H*TILE); }
  // BLOOM-015: a faint tint of the active shock's kind over the whole map, following the shock's own ramp (temporary feedback)
  if(CLIM) for(const ax in CL.axes){ const A=CL.axes[ax]; if(!A.shock||!A.offset) continue; const c=SHOCK_UI[A.shock.id]||SHOCK_UI.fallback, k=Math.abs(A.offset)/A.shock.magnitude;
    ctx.fillStyle=`rgba(${c.rgb},${(0.16*k).toFixed(3)})`; ctx.fillRect(0,0,W*TILE,H*TILE); }
  // purchase preview tint: green = would open, red = would close
  if(preview){ for(const [list,col] of [[preview.gain,"rgba(102,209,127,0.28)"],[preview.lose,"rgba(226,96,79,0.34)"]])
    for(const sec of list){ ctx.fillStyle=col; for(const t of SEC_TILES[sec]) ctx.fillRect((t%W)*TILE,((t/W)|0)*TILE,TILE,TILE); } } // exact size: overlap would double the alpha into grid seams
  // borders
  ctx.strokeStyle="rgba(5,7,12,0.8)"; ctx.lineWidth=1.4; ctx.beginPath();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const s=TILEMAP[y*W+x];
    if(x+1>=W||TILEMAP[y*W+x+1]!==s){ctx.moveTo((x+1)*TILE,y*TILE);ctx.lineTo((x+1)*TILE,(y+1)*TILE);} if(x===0){ctx.moveTo(0,y*TILE);ctx.lineTo(0,(y+1)*TILE);}
    if(y+1>=H||TILEMAP[(y+1)*W+x]!==s){ctx.moveTo(x*TILE,(y+1)*TILE);ctx.lineTo((x+1)*TILE,(y+1)*TILE);} if(y===0){ctx.moveTo(x*TILE,0);ctx.lineTo((x+1)*TILE,0);}
  }
  ctx.stroke();
  // BLOOM-014 fronts: an amber line on every tile edge where a Living player tile touches native cover
  if(COMP){ ctx.strokeStyle=FRONT_C; ctx.lineWidth=Math.max(2,TILE*0.2); ctx.beginPath(); const NA=CS.native, liv=t=>state[t]===LIV, nat=t=>NA[t]>0;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const i=y*W+x;
      if(x+1<W&&((liv(i)&&nat(i+1))||(nat(i)&&liv(i+1)))){ ctx.moveTo((x+1)*TILE,y*TILE+1); ctx.lineTo((x+1)*TILE,(y+1)*TILE-1); }
      if(y+1<H&&((liv(i)&&nat(i+W))||(nat(i)&&liv(i+W)))){ ctx.moveTo(x*TILE+1,(y+1)*TILE); ctx.lineTo((x+1)*TILE-1,(y+1)*TILE); } }
    ctx.stroke(); }
  // selection + purchase preview outlines
  if(selected>=0) outline(selected,"#7fe3c0",3);
  if(preview){ preview.gain.forEach(i=>outline(i,"#66d17f",3,[6,4])); preview.lose.forEach(i=>outline(i,"#e2604f",3,[6,4]));
    (preview.reachHostile||[]).forEach(i=>outline(i,"#e7c14e",2,[3,4])); } // reachable across water, ground hostile now
  // BLOOM-011 sky changes (a Terraform preview, and for a few seconds after a Terraform purchase): regions the new sky
  // helps but does not open yet (thin pale-green dots) and regions it makes worse but does not close (thin orange dots)
  const sk=preview&&preview.better?preview:(skyFx&&performance.now()<skyFx.until?skyFx:null);
  if(sk){ if(sk===skyFx){ sk.gain.forEach(i=>outline(i,"#66d17f",3)); sk.lose.forEach(i=>outline(i,"#e2604f",3)); }
    sk.better.forEach(i=>outline(i,"#b6f0a8",2,[2,4])); sk.worse.forEach(i=>outline(i,"#f0a050",2,[2,4])); }
  // BLOOM-012: regions the scenario's decline just pushed across a threshold (orange = worse, pale green = opened)
  if(PRESS||CLIM){ const now=performance.now(); for(const x of PX_FX) if(now<x.until) outline(x.sec,x.worse?"#ff9a50":"#b6f0a8",3,[5,3]); }
  // BLOOM-014: a region a competition event just named (amber = the native gained, mint = your plant gained, violet = contact)
  if(COMP){ const now=performance.now(); for(const x of CX_FX) if(now<x.until) outline(x.sec,x.color,3,[5,3]); }
  // bubbles
  for(const b of bubbles){ const px=b.x*TILE,py=b.y*TILE, r=Math.max(4,TILE*0.42);
    ctx.beginPath(); ctx.arc(px,py,r,0,7); ctx.fillStyle="rgba(255,212,121,0.92)"; ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle="#7a5a15"; ctx.stroke(); }
  // labels
  const fs=Math.max(8,Math.min(12,TILE)); ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.font=`${fs}px "DejaVu Sans Mono",monospace`;
  SEC.forEach((s,i)=>{ const px=CENT[i].x*TILE,py=CENT[i].y*TILE;

    ctx.fillStyle=i===selected?"#fff":"rgba(232,238,248,0.9)"; ctx.fillText(LABEL[i].toUpperCase(),px,py);
    if(s.isOrigin){ctx.fillStyle="#ffd479"; ctx.fillText("★",px,py+fs+1);}
  });
  drawBadges(); drawCrossings(performance.now());
}
// BLOOM-009: one small badge per region that is NOT on Balanced (its focus icon) and/or owns a local upgrade (gold ring
// + dot), just above the region's name, so the map shows at a glance which colony does what
function drawBadges(){
  const r=Math.max(7,Math.min(11,TILE*0.75)), fs=Math.max(8,Math.min(12,TILE));
  SEC.forEach((_,i)=>{ const m=sim.getColonyFocus(i), sp=sim.getSpecialization(i); if(m==="balanced"&&!sp) return;
    const px=CENT[i].x*TILE, py=CENT[i].y*TILE-fs-r-1, u=FOCUS_UI[m];
    ctx.beginPath(); ctx.arc(px,py,r,0,7); ctx.fillStyle=m==="balanced"?"#3a3f4c":u.color; ctx.fill();
    ctx.lineWidth=sp?3:1.5; ctx.strokeStyle=sp?"#ffd479":"rgba(5,7,12,0.9)"; ctx.stroke();
    if(sp){ ctx.beginPath(); ctx.arc(px+r*0.8,py-r*0.8,Math.max(2.5,r*0.32),0,7); ctx.fillStyle="#ffd479"; ctx.fill(); ctx.lineWidth=1; ctx.strokeStyle="#5a3f0a"; ctx.stroke(); }
    if(m!=="balanced"){ ctx.fillStyle="#10131a"; ctx.font=`bold ${Math.round(r*1.2)}px "DejaVu Sans Mono",monospace`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(u.icon,px,py+0.5); }
  });
}
// BLOOM-009: Waterborne crossing feedback. Each animation is one real engine event (sim.crossing.events): a few seed dots
// travel from the source coastal tile over the water to the landing tile. took:false (seeds ARRIVED) ends in a faint
// pale ripple; took:true (a new FOOTHOLD) ends in a bright gold-green burst. Temporary visuals.
const XANIM=[], XHIST=[]; let lastXid=0; const XTRAVEL=1300, XLAND=700, XMAX_ARRIVALS=6;
function pollCrossings(now){
  for(const e of sim.crossing.events){ if(e.id<=lastXid) continue; lastXid=e.id;
    if(!e.took&&XANIM.filter(a=>!a.took).length>=XMAX_ARRIVALS) continue; // too many at once (fast speed): skip extra ARRIVALS, never footholds
    const a={id:e.id, from:e.from, to:e.to, took:e.took, t0:now}; XANIM.push(a); XHIST.push({id:e.id, from:e.from, to:e.to, took:e.took, tick:e.tick}); if(XHIST.length>200) XHIST.shift();
    const sec=TILEMAP[e.to];
    if(e.took) log(`🌊 Waterborne seeds crossed the water and took root in ${LABEL[sec]}!`);
    else if(!XWARNED.has(sec)&&evaluate(sec).fitness<=CFG.grow.growThresh){ XWARNED.add(sec); const ev=evaluate(sec);
      log(`🌊 Seeds washed up on ${LABEL[sec]}, but they cannot take root there: ${LIMIT_MSG[ev.limitKey](ev)}.`); } }
  for(let k=XANIM.length-1;k>=0;k--) if(now-XANIM[k].t0>XTRAVEL+XLAND) XANIM.splice(k,1);
}
const XWARNED=new Set();
function drawCrossings(now){
  for(const a of XANIM){
    const x0=((a.from%W)+.5)*TILE, y0=(((a.from/W)|0)+.5)*TILE, x1=((a.to%W)+.5)*TILE, y1=(((a.to/W)|0)+.5)*TILE;
    const dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy)||1, cx=(x0+x1)/2-dy/L*L*0.22, cy=(y0+y1)/2+dx/L*L*0.22; // gentle arc
    const t=(now-a.t0)/XTRAVEL;
    for(let k=0;k<3;k++){ const u=clamp(t-k*0.12,0,1); if(t-k*0.12<0||t-k*0.12>1) continue;
      const bx=(1-u)*(1-u)*x0+2*(1-u)*u*cx+u*u*x1, by=(1-u)*(1-u)*y0+2*(1-u)*u*cy+u*u*y1;
      ctx.beginPath(); ctx.arc(bx,by,Math.max(2.5,TILE*0.27),0,7); ctx.fillStyle="#f4e2b0"; ctx.fill(); ctx.lineWidth=1.4; ctx.strokeStyle="#6b4a1a"; ctx.stroke(); }
    const lt=(now-a.t0-XTRAVEL)/XLAND; if(lt<0||lt>1) continue;
    if(a.took){ ctx.beginPath(); ctx.arc(x1,y1,TILE*(0.6+2.2*lt),0,7); ctx.lineWidth=3.5; ctx.strokeStyle=`rgba(255,226,120,${1-lt})`; ctx.stroke();
      ctx.beginPath(); ctx.arc(x1,y1,TILE*0.7*(1-lt*0.5),0,7); ctx.fillStyle=`rgba(150,240,120,${0.9*(1-lt)})`; ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(x1,y1,TILE*(0.35+1.0*lt),0,7); ctx.lineWidth=1.5; ctx.strokeStyle=`rgba(190,220,255,${0.7*(1-lt)})`; ctx.stroke(); }
  }
}

function outline(sec,color,width,dash){
  outlinePath(sec,"rgba(5,7,12,0.85)",width+2,[]); outlinePath(sec,color,width,dash); } // dark underlay: readable over light seedlings and dark stands
function outlinePath(sec,color,width,dash){
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.setLineDash(dash||[]); ctx.beginPath();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ if(TILEMAP[y*W+x]!==sec)continue;
    if(x+1>=W||TILEMAP[y*W+x+1]!==sec){ctx.moveTo((x+1)*TILE,y*TILE);ctx.lineTo((x+1)*TILE,(y+1)*TILE);}
    if(x===0||TILEMAP[y*W+x-1]!==sec){ctx.moveTo(x*TILE,y*TILE);ctx.lineTo(x*TILE,(y+1)*TILE);}
    if(y+1>=H||TILEMAP[(y+1)*W+x]!==sec){ctx.moveTo(x*TILE,(y+1)*TILE);ctx.lineTo((x+1)*TILE,(y+1)*TILE);}
    if(y===0||TILEMAP[(y-1)*W+x]!==sec){ctx.moveTo(x*TILE,y*TILE);ctx.lineTo((x+1)*TILE,y*TILE);}
  } ctx.stroke(); ctx.setLineDash([]);
}

function settleSeconds(lv,to){ const b=CI_D.baseline; return lv<=to?0:CI_D.settling.halfLifeSeconds*Math.log2((lv-b)/Math.max(1e-6,to-b)); }

// climate events (sim.climate.events — real engine transitions): one message + a glow on the bar each (no spam: band rises

/* ---- upgrade catalogue = content/traits.js; prices/effects/rules = engine ---- */
const UP=sim.traits, upById=sim.traitById;
// BLOOM-011 Terraform readability: what a sky change does to EVERY region, not only the ones that switch between open and
// blocked. A what-if on a copy of the sky (restored at once, like the engine's own previewOf): fitness before / after.
// better = the region's conditions improve but it stays blocked; worse = they deteriorate but it can still grow there.
let skyFx=null; // the last Terraform purchase's effect, outlined on the map / shown in the HUD for a few seconds
function skyWhatIf(u){
  const e=u.effect, ax=e.axis, o=G[ax], before=SEC.map((_,i)=>evaluate(i)), nf0=COMP?SEC.map((_,i)=>sim.nativeEvaluate(i).fitness):null;
  let v=o+e.delta; if(e.min!==undefined||e.max!==undefined) v=clamp(v,e.min??-Infinity,e.max??Infinity);
  G[ax]=v; const after=SEC.map((_,i)=>evaluate(i)), nf1=COMP?SEC.map((_,i)=>sim.nativeEvaluate(i).fitness):null; G[ax]=o;
  return {...skyDiff(ax,o,v,before,after), ...(COMP?nativeSkyShift(nf0,nf1):{})};
}
// (better = the ground moved closer to the plant's tolerance window on the changed axis, e.g. −32 °C → −26 °C on frozen
// ground: still deadly, but nearer; worse = the region can still grow but its fitness dropped)
function skyDiff(ax,from,to,before,after){
  const g=CFG.grow.growThresh, ok=f=>f>g, out={axis:ax, from, to, gain:[], lose:[], better:[], worse:[]}, d=sim.derived();
  const [lo,hi]=ax==="temp"?[d.tempFloor,d.tempCeil]:[d.waterPos-d.waterTol,d.waterPos+d.waterTol];
  const off=e=>{ const v=ax==="temp"?e.effT:e.effM; return v<lo?lo-v:v>hi?v-hi:0; };
  SEC.forEach((_,i)=>{ const a=before[i].fitness, b=after[i].fitness;
    if(ok(b)&&!ok(a)) out.gain.push(i); else if(ok(a)&&!ok(b)) out.lose.push(i);
    else if(!ok(b)&&off(after[i])<off(before[i])) out.better.push(i);
    else if(ok(b)&&b<a-0.01) out.worse.push(i); });
  out.after=after; return out;
}
function skyWords(d){
  const nm=a=>a.map(i=>LABEL[i]).join(", "), why=i=>LIMIT_MSG[d.after[i].limitKey](d.after[i]);
  const sky=d.axis==="temp"?`sky ${degC(d.from)} → ${degC(d.to)}`:`sky moisture ${d.from} → ${d.to}`;
  let drift=PRESS&&PS.progress>0?(d.axis==="temp"?` (thinning air ${sgn(PS.offsets.temp)} °C on top)`:` (thinning air ${sgn(PS.offsets.moist)} on top)`):"";
  if(CLIM&&CL.axes[d.axis]&&CL.axes[d.axis].shock) drift+=` (${lowerName(CL.axes[d.axis].shock.name)} ${axVal(d.axis,CL.offsets[d.axis])} on top for now)`;
  return [sky+drift, d.gain.length?`opens: ${nm(d.gain)}`:"", d.lose.length?`⚠ closes: ${d.lose.map(i=>`${LABEL[i]} (${why(i)})`).join(", ")}`:"",
    d.better.length?`closer, still blocked: ${nm(d.better)}`:"", d.worse.length?`⚠ worse, still growing: ${nm(d.worse)}`:"",
    d.nb&&d.nb.length?`🌿 suits native plants less: ${nm(d.nb)}`:"", d.nw&&d.nw.length?`🌿 suits native plants more: ${nm(d.nw)}`:""].filter(Boolean).join(" · ");

function tileAt(ev){ const r=cv.getBoundingClientRect(); const x=Math.floor((ev.clientX-r.left)/TILE),y=Math.floor((ev.clientY-r.top)/TILE);
  if(x<0||y<0||x>=W||y>=H)return{sec:-2,tile:-1}; return {sec:TILEMAP[y*W+x],tile:y*W+x}; }
// (BLOOM-029A) the map's two actions as functions, so the map click and the run UI adapter take the same path
// a bubble collected by the player: bubbles[k]
function collectBubbleAt(k){ const b=bubbles[k]; if(!b) return false; sim.collectBubble(k); renderHUD(lastCov); draw();
  BUB_SEEN.delete(b); emit("bubble-collect",{how:"click", tile:b.tile, ...secRef(TILEMAP[b.tile]), value:CFG.econ.bubbleValue}); return true; }
// a map click on section `sec` (−1 water, −2 outside the map) at `tile` (−1 = none): clicking the selected region again deselects
function selectAt(sec,tile){
  selectedWater=sec===-1&&tile>=0; // water tile (sec -2 = outside the map)
  const was=selected; selected=(sec<0||sec===selected)?-1:sec; renderInspect(); draw();
  emit("region-select",{...secRef(selected), previous:was>=0?SEC[was].id:null, water:selectedWater, tile});
}
cv.addEventListener("click",e=>{
  const {sec,tile}=tileAt(e);
  // bubble hit first
  for(let k=bubbles.length-1;k>=0;k--){ const b=bubbles[k]; const px=b.x*TILE,py=b.y*TILE; const r=cv.getBoundingClientRect();
    if(Math.hypot(e.clientX-r.left-px,e.clientY-r.top-py)<=Math.max(6,TILE*0.55)){ collectBubbleAt(k); return; } }
  selectAt(sec,tile);
});
// (BLOOM-028D1) a bubble that left the map without a click collected itself (the engine's auto-collect): one event each. Checked
// once a frame (a rolled bubble lives ≥ econ.bubbleAutoTicks ticks, far longer than a frame; only BLOOM_API.advance can skip frames)
let BUB_SEEN=new Set();
function pollBubbles(){ if(!BUB_SEEN.size&&!bubbles.length) return; const now=new Set(bubbles);
  for(const b of BUB_SEEN) if(!now.has(b)) emit("bubble-collect",{how:"auto", tile:b.tile, ...secRef(TILEMAP[b.tile]), value:CFG.econ.bubbleValue*CFG.econ.autoCollectShare});
  BUB_SEEN=now; }
// (BLOOM-028D1) a bonus bubble placed on purpose (scripted training moments, QA): on the Living tile of region `sectionId` (default:
// the origin) nearest that region's centre — the same tile for the same map state. Returns the tile, or -1 (nothing living there).
function placeBubble(sectionId){ const s=sectionId==null?ORIGIN:SIDX[sectionId]; if(s===undefined) return -1;
  const c=CENT[s]; let best=-1, bd=Infinity;
  for(const t of SEC_TILES[s]){ if(state[t]!==LIV||bubbles.some(b=>b.tile===t)) continue;
    const dx=(t%W)+.5-c.x, dy=((t/W)|0)+.5-c.y, d=dx*dx+dy*dy; if(d<bd) { bd=d; best=t; } }
  if(best<0||!sim.placeBubble(best)) return -1; BUB_SEEN.add(bubbles[bubbles.length-1]); draw(); runUI.invalidate("bubble-place"); return best; }
window.BLOOM_RUN_UI={ placeBubble };

// tiny programmatic portrait of the final plant: each owned trait adds a visible feature
function drawPlant(c){
  const S=4, X=c.getContext("2d"), px=(x,y,col,w=1,h=1)=>{X.fillStyle=col;X.fillRect(x*S,y*S,w*S,h*S);};
  X.clearRect(0,0,c.width,c.height);
  const leaf = genome.rad?"#7a5bb0": genome.heat?"#8fc9a4":"#5fbf6e", stem="#3f8a4c", soil="#5b4330";
  px(0,40,soil,34,10);                                           // ground
  if(genome.waterArm==="wet"){ px(0,39,"#3a6f9a",34,2); }        // standing water
  const rootLen = genome.waterArm==="dry" ? 9 : 4;                // drought → deep taproot
  px(16,41,"#c9a66b",1,rootLen); px(14,42,"#c9a66b",1,2); px(18,42,"#c9a66b",1,2);
  if(genome.waterArm==="wet"){ [9,12,21,24].forEach(x=>px(x,36,"#b89868",1,4)); } // snorkel roots poke above water
  px(16,14,stem,1,26);                                           // stem
  const lw = genome.waterArm==="dry" ? 3 : 2;                     // succulent → thick leaves
  [[30,-1],[25,1],[20,-1],[16,1]].forEach(([y,d])=>{
    const x0 = d<0 ? 16-7 : 17; px(x0,y,leaf,7,lw);
    if(genome.cold) for(let k=0;k<7;k+=2) px(x0+k,y-1,"#e8f0ff");                 // frost hairs
    if(genome.salt) px(d<0?x0:x0+6,y+lw-1,"#ffffff");                           // salt crystal
  });
  if(genome.earlyMat){ px(15,11,"#ffd479",3,3); px(16,12,"#e2604f"); }           // early flower
  if(genome.seedOut){ for(let k=0;k<genome.seedOut*3;k++) px(20+k*3,8-(k%2)*3,"#f4f1e4"); } // drifting seeds
  if(genome.waterSeeds){ px(0,38,"#3a6f9a",8,2); px(2,36,"#8a5a2b",3,3); px(3,36,"#b98a4a"); } // a floating seed pod
}

// BLOOM-012: the scenario's identity and how far the decline got, with the drift the plant endured (pressure runs only)
function pressureReport(){
  if(!PRESS) return ""; const o=PS.offsets, done=PS.progress>=1;
  return `<div class="press" id="repPressure"><b>Pressure: ${SCN.display.title}</b> — ${phaseName(PS.phase)} (${Math.round(PS.progress*100)}% of the decline).
    Your plant endured: moisture <b>${sgn(o.moist)}</b>, temperature <b>${sgn(o.temp)} °C</b>, radiation <b>${sgn(o.rad)}</b>${done?" — the final harsh state.":`. The decline continues if you keep playing (final: moisture ${sgn(PS.max.moist)}, temperature ${sgn(PS.max.temp)} °C, radiation ${sgn(PS.max.rad)}).`}</div>`;
}
// BLOOM-014: one competition line — how much land the native plants held at the start, at their peak and now, how many regions
// were contested, and the regions left to them (winning never needed every native plant gone)
function competitionReport(){
  if(!COMP) return ""; const pct=x=>Math.round(x*100), contested=CS.everContested.reduce((a,b)=>a+b,0);
  const left=SEC.map((_,i)=>i).filter(i=>{ const c=sim.competitionAt(i); return c.nativeShare>=0.4; }).map(i=>LABEL[i]);
  return `<div class="comp" id="repComp"><b>Competition: ${SCN.display.title}</b> — native plants held <b>${pct(CS.startShare)}%</b> of the land at the start,
    <b>${pct(CS.peakShare)}%</b> at their peak and <b>${pct(CS.share)}%</b> now. ${contested} region${contested===1?"":"s"} became contested.
    ${left.length?`Left to native vegetation: ${left.join(", ")}. You did not need to remove every native plant.`:"Hardly any native cover is left: your plant out-competed it almost everywhere."}</div>`;
}
// BLOOM-012: extinction (scenarios that enable it): the engine has confirmed no living plants for the scenario's grace period
function onLoss(why){
  const mins=Math.floor(sim.ticks*CFG.tickMs/60000), secs=Math.round(sim.ticks*CFG.tickMs/1000)%60, o=PS.offsets;
  const r=document.getElementById("report"); r.classList.add("lost");
  r.innerHTML=`<h2>✕ EXTINCTION</h2>
    <div class="sub" id="lossWhy">No living plants were left anywhere for ${SCN.loss.extinctionGraceSeconds} s, so the run is over (${mins}m ${String(secs).padStart(2,"0")}s${BLOOM_RUN.kind==="procedural"?` on <b>${BLOOM_RUN.planet.name}</b>, ${BLOOM_RUN.archetype.name} · ${SEEDWORD} ${BLOOM_RUN.seed}`:""}).</div>
    ${pressureReport()}${competitionReport()}${climateReport()}
    <div class="debrief" id="lossDebrief"><b>What happened:</b> ${(SCN.display&&SCN.display.lossNote)||"the planet kept changing and your plant could no longer live on any of its land. Adapting to the new conditions (Adapt), pushing the sky back (Terraform) or protecting your strongest colonies earlier can keep a foothold alive."}</div>
    ${PLAY?runActionsHtml():`<button class="btn" id="lossRestart">Restart this run ↻</button>`}`;
  document.getElementById("reportModal").classList.add("on");
  if(PLAY) wireActions(r); else document.getElementById("lossRestart").addEventListener("click",()=>location.reload());
  log(`✕ Extinction: ${why}.`);
}
function onWin(cov){
  // build list + real-plant analogs (acceptance Q10) come from the trait data (content/traits.js)
  const owned=UP.filter(u=>u.board!=="Terraform" && sim.ownedTier(u)>0);
  const built=owned.map(u=> (u.effect.type==="level"||u.effect.type==="crossing")&&u.effect.max===1 ? u.name : `${u.short||u.name} ×${sim.ownedTier(u)}`);
  const terra=UP.filter(u=>u.board==="Terraform" && sim.ownedTier(u)>0).map(u=>`${u.short||u.name} ×${sim.ownedTier(u)}`);
  const held=[], gaveUp=[]; const liv=livingCountBySection();
  // a region your plant CAN grow in is just still filling in — only unfit regions count as given up
  SEC.forEach((s,i)=>{ if(liv[i]/AREA[i]>0.4) held.push(LABEL[i]);
    else { const e=evaluate(i); if(e.fitness<=CFG.grow.growThresh) gaveUp.push(`<b>${LABEL[i]}</b> — ${LIMIT_MSG[e.limitKey](e)}`); } });
  const mins=Math.floor(sim.ticks*CFG.tickMs/60000), secs=Math.round(sim.ticks*CFG.tickMs/1000)%60;
  document.getElementById("report").innerHTML=`
    <h2>★ ${TRAIN?TC.complete.toUpperCase():"BLOOM"}</h2>
    <div class="sub">You held ${Math.round(cov*100)}% of the land${BLOOM_RUN.kind==="procedural"?` of <b>${BLOOM_RUN.planet.name}</b> (${BLOOM_RUN.archetype.name} · ${SEEDWORD} ${BLOOM_RUN.seed})`:""}${SCEN?` under <b>${SCN.name}</b>`:""} in ${mins}m ${String(secs).padStart(2,"0")}s.</div>
    ${pressureReport()}${competitionReport()}${climateReport()}
    <div class="top"><canvas id="plantCv" width="136" height="200"></canvas>
      <div><b>Your plant became:</b><ul>${built.map(b=>`<li>${b}</li>`).join('')||'<li>the unmodified pioneer</li>'}</ul>
      ${terra.length?`<div style="margin-top:8px"><b>You reshaped the sky:</b> ${terra.join(', ')}</div>`:''}</div></div>
    <div style="margin-top:10px"><b>Regions bloomed:</b> ${held.join(', ')}</div>
    ${sim.colonies.spec.some(Boolean)?`<div style="margin-top:6px"><b>Colony upgrades:</b> ${SEC.map((_,i)=>sim.getSpecialization(i)?`${SPEC[sim.getSpecialization(i)].name} in ${LABEL[i]}`:null).filter(Boolean).join(', ')}</div>`:''}
    <div class="debrief"><b>Why it worked:</b> every region has a <i>limiting factor</i>: the one condition furthest outside your plant's tolerance. You fixed enough of them to hold the planet${gaveUp.length?`, and your build gave these up:<ul>${gaveUp.map(g=>`<li>${g}</li>`).join('')}</ul>No plant tolerates everything. Adapting to one extreme costs you another, so choosing what to sacrifice was the real strategy.`:"."}</div>
    ${owned.length?`<div><b>Real plants do this too:</b><ul class="analog">${owned.filter(u=>u.science).map(u=>`<li><b>${u.name}</b> — ${u.science}</li>`).join('')}</ul></div>`:''}
    <button class="btn" id="reportContinue" data-tutorial="report-continue">Keep playing →</button>${PLAY?runActionsHtml():""}`;
  if(PLAY) wireActions(document.getElementById("report"));
  drawPlant(document.getElementById("plantCv"));
  document.getElementById("reportModal").classList.add("on");
  document.getElementById("reportContinue").addEventListener("click",()=>{ document.getElementById("reportModal").classList.remove("on"); running=true; document.getElementById("btnPlay").textContent="⏸ pause"; runUI.invalidate("continue"); });
  log(`★ Bloom! ${Math.round(cov*100)}% coverage.`);
}

let lastCov=0, acc=0, last=0, lastInspectTick=-1;
function frame(ts){
  if(!last)last=ts; const dt=ts-last; last=ts;
  if(running){ acc+=dt*speed;
    while(acc>=CFG.tickMs){ lastCov=sim.tick(); acc-=CFG.tickMs; if(!running)break; }
  }
  pollBubbles(); pollCrossings(performance.now()); pollPressure(performance.now()); pollCompetition(performance.now()); pollClimate(); renderHUD(lastCov); renderPressure(); renderComp(); renderClimate(); refreshShop(); refreshColonyCtl(); draw();
  runUI.frame(); // (BLOOM-029A) one "the run advanced" notice for the adapter's subscribers, only on frames where the sim ticked
  // re-read the inspected section every 3 sim ticks (not every frame — while paused that would swallow clicks)
  if(selected>=0 && sim.ticks%3===0 && sim.ticks!==lastInspectTick){ lastInspectTick=sim.ticks; renderInspect(); }
  requestAnimationFrame(frame);
}

window.BLOOM_API={

</script>
<script>
"use strict";
/* ========================================================================== */
/*  BOOT (BLOOM-007): choose the planet, then start the UI above.              */
/*  No query string → First Bloom (the accepted slice, unchanged).             */
/*  ?archetype=<id>&seed=<public seed> → BLOOM.generateFromArchetype, the real */
/*  production path (validator layers 1–8). Failure → explicit failure state;  */
/*  another seed is never substituted and no world starts.                     */
/*  BLOOM-012: &scenario=<id> (content/scenarios.js), orthogonal to the planet.*/
/*  None → Eden, exactly as before. Unknown / malformed → explicit failure.    */
/*  A pressure scenario starts only if planet + scenario pass layer P          */
/*  (BLOOM.validateScenario, real pressured witnesses); its solutions are      */
/*  never handed to the UI.                                                    */
/* ========================================================================== */
// the run summary of an accepted procedural world (shared by the harness and the BLOOM-016 player path)
const procSummary=(A,planet)=>{ const a=planet.archetype; return {kind:"procedural", archetypeId:A.id, archetype:A.name, publicSeed:a.publicSeed,
  attempt:a.attempt, planetId:planet.id, name:planet.name, validatedLayers:a.validatedLayers, landmasses:a.landmasses, actualWaterPct:a.actualWaterPct}; };
function harnessRun(){
  if(!window.BLOOM||!window.BLOOM_DATA||!BLOOM_DATA.planets||!BLOOM_DATA.planets.first_bloom) return {kind:"missing"};
  const q=new URLSearchParams(location.search), aid=q.get("archetype"), seedText=q.get("seed"), scText=q.get("scenario");
  const kind=aid===null&&seedText===null?"authored":"procedural";
  const fail=(why,extra={})=>({kind, failed:true, summary:{kind, failed:true, archetypeId:aid, seed:seedText, scenarioId:scText, why, ...extra}});
  // BLOOM-028D1: planet=<id> names an AUTHORED world (BLOOM_DATA.planets); training=1 opens the training world
  // (BLOOM_DATA.training.planetId, unless planet= names another) — authored only, Eden only, never a substitute
  const training=q.get("training")==="1", planetText=q.get("planet"), who={planetName:training?"Training":`planet ${planetText}`};
  if((training||planetText!==null)&&kind!=="authored") return fail(training?"training opens an authored world: leave out archetype= and seed=":"planet= names an authored world: it cannot be combined with archetype= or seed=", {badPlanet:true, ...who});
  if(training&&scText!==null) return fail("training has no scenario: leave out scenario=", {badPlanet:true, ...who});
  if(training&&!(BLOOM_DATA.training&&BLOOM.play&&BLOOM.play.deriveConfig)) return fail("the training data (content/training.js) or BLOOM.play is not loaded", {badPlanet:true, ...who});
  let scenario=null; // null = no scenario parameter: Eden, the engine exactly as before BLOOM-012
  if(scText!==null){
    if(!/^[a-z][a-z0-9_]{0,40}$/.test(scText)) return fail(`"scenario" must be a scenario id from content/scenarios.js (got "${scText}")`, {badScenario:true});
    try { scenario=BLOOM.pressure.resolveScenario(BLOOM_DATA.scenarios, scText); } catch(e){ return fail(e.message, {badScenario:true}); } }
  const withScenario=(run)=>{ // layer P for a scenario that changes the run (pressure and/or competition); Eden adds nothing to prove
    run.scenario=scenario; run.summary.scenarioId=scenario?scenario.id:"eden"; run.summary.scenario=scenario?scenario.name:"Eden";
    if(!BLOOM.pressure.isDynamic(scenario)) return run;
    const v=BLOOM.validateScenario(run.planet, BLOOM_DATA.config, BLOOM_DATA.traits, scenario, {archetypeId:run.archetype?run.archetype.id:null});
    if(!v.ok) return fail(v.reason||`${scenario.name} ${v.status}`, {archetype:run.archetype&&run.archetype.name, planetName:run.planet.name, scenario:scenario.name, scenarioRejected:v.status});
    run.summary.scenarioValidation={status:v.status, strategiesProven:v.strategies.length, required:v.required}; // a count only — no builds, no plans
    return run; };
  if(kind==="authored"){
    const pid=planetText!==null?planetText:training?BLOOM_DATA.training.planetId:"first_bloom";
    const P=/^[a-z][a-z0-9_]{0,40}$/.test(pid)&&Object.prototype.hasOwnProperty.call(BLOOM_DATA.planets,pid)?BLOOM_DATA.planets[pid]:null;
    if(!P) return fail(`unknown planet "${pid}" (authored worlds: ${Object.keys(BLOOM_DATA.planets).join(", ")})`, {badPlanet:true, planetName:`planet ${pid}`});
    const run=withScenario({kind:"authored", planet:P, planetParam:planetText, summary:{kind:"authored", planetId:P.id, name:P.name}});
    if(training&&!run.failed){ const T=BLOOM_DATA.training; // the derived config is built once, here; content/config.js is never edited
      run.play=true; run.summary.training=true;
      run.training={ planetId:P.id, rngSeed:T.rngSeed, config:BLOOM.play.deriveConfig(BLOOM_DATA.config, T.config),
        returnTo:BLOOM.play.safeReturn(q.get("return"), location.href, T.returnTo) }; }
    return run; }
  const A=(BLOOM_DATA.archetypes||[]).find(a=>a.id===aid);
  if(!A) return fail(`unknown archetype "${aid}" (known: ${(BLOOM_DATA.archetypes||[]).map(a=>a.id).join(", ")})`);
  if(seedText===null||!/^\d{1,10}$/.test(seedText)||+seedText>4294967295) return fail(`"seed" must be a whole number 0–4294967295 (got ${seedText===null?"nothing":`"${seedText}"`})`);
  const seed=+seedText;
  let planet;
  try { planet=BLOOM.generateFromArchetype(A, seed, { config:BLOOM_DATA.config, traits:BLOOM_DATA.traits }); }
  catch(e){ if(!e.attempts) throw e;
    const byLayer={}; for(const a of e.attempts){ const m=(a.rejected[0]||"").match(/^layer (\d)/); const k=m?`layer ${m[1]}`:"structure / geography"; byLayer[k]=(byLayer[k]||0)+1; }
    return fail(`no acceptable world in ${e.attempts.length} attempts`, { archetype:A.name, attempts:e.attempts.length, rejectedByLayer:byLayer }); }
  // the player never sees validator solutions: drop the witness plan and strategy signatures before the UI starts
  BLOOM.play.stripPlanet(planet);
  return withScenario({kind:"procedural", planet, archetype:A, seed, summary:procSummary(A, planet)});
}
function startRun(run){
window.BLOOM_RUN=run;
if(BLOOM_RUN.kind==="missing"){
  document.body.innerHTML='<p style="padding:24px;font-family:monospace;color:#ff6b6b">BLOOM could not load its engine/content files. Open demos/demo-run.html from inside the full Bloom folder (it needs ../content, ../planets and ../resources).</p>';
} else if(BLOOM_RUN.failed){ // explicit failure state: identify the request, start nothing
  const f=BLOOM_RUN.summary, esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const scen=f.badScenario||f.scenarioRejected, where=f.kind==="authored"?(f.planetName?esc(f.planetName):"First Bloom")
    :`${f.archetype?esc(f.archetype):`archetype <code>${esc(f.archetypeId)}</code>`} · public seed <code>${esc(f.seed)}</code>`;
  document.title=scen?"BLOOM — run not started":"BLOOM — generation failed"; document.querySelector("header h1 small").textContent=scen?"· run not started":"· generation failed";
  document.querySelector("main").innerHTML=`<div class="genfail" id="genFail" style="grid-column:1/-1;align-self:start"><h2>${scen?"NO RUN STARTED":"NO WORLD GENERATED"}</h2>
    <div>${where}${f.scenarioId!==null&&f.scenarioId!==undefined?` · scenario <code>${esc(f.scenarioId)}</code>`:""}</div>
    <p>${esc(f.why)}.${f.rejectedByLayer?` Rejected attempts: ${Object.entries(f.rejectedByLayer).map(([k,n])=>`${esc(k)} ${n}`).join(" · ")}.`:""}</p>
    <p style="color:var(--dim)">${f.scenarioRejected?`This planet + scenario combination did not pass the scenario validation layer (${esc(f.scenarioRejected)}). No other scenario or seed was substituted and no run was started.`
      :f.badPlanet?`No other world was substituted and no run was started.`
      :f.badScenario?`Known scenarios: ${(BLOOM_DATA.scenarios||[]).map(x=>`<code>${esc(x.id)}</code>`).join(", ")}. Leave <code>scenario=</code> out for Eden. No other scenario was substituted and no run was started.`
      :`${f.attempts?"This public seed is not playable under the current validation policy.":"The launch parameters are invalid."} No other seed was substituted and no world was started. Try a different <code>seed=</code> value.`}</p></div>`;
  document.querySelector("header .hud").style.visibility="hidden"; document.querySelector("header .controls").style.visibility="hidden";
  document.getElementById("log").textContent=scen?`Run not started (scenario ${f.scenarioId}).`:`Generation failed for public seed ${f.seed}.`;
  window.BLOOM_API={ run:f };
} else { // run the game UI as an ordinary classic script (same globals as before BLOOM-007)
  if(BLOOM_RUN.training){ // BLOOM-028D1: the training page opens under black (the title faded out into it). Its training layer (an ES
    // module, loaded here in training mode only) lifts it once the run is drawn and owns the exits; without that layer the black just goes
    const c=document.createElement("div"); c.id="trainingCover"; c.className="training-cover"; c.setAttribute("aria-hidden","true"); document.body.appendChild(c);
    setTimeout(()=>{ if(!c.dataset.owner) c.remove(); },2000);
    const m=document.createElement("script"); m.type="module"; m.src="../resources/training/training-run.js"; document.head.appendChild(m); }
  const ui=document.createElement("script"); ui.textContent=document.getElementById("bloomUI").textContent; document.body.appendChild(ui);
}
}
/* ========================================================================== */
/*  BLOOM-016 PLAYER PATH (?play=1&archetype=<id>&scenario=<id>[&seed=<n>]),  */
/*  launched from index.html. Without a seed: a bounded search over          */
/*  automatically chosen World Seeds (BLOOM.play.searchWorld: archetype      */
/*  layers 1–8, then layer P when the scenario changes the run) behind a     */
/*  "Preparing planet…" screen, in a worker when the browser allows it. With */
/*  a seed (Play again / a shared link): that seed only. The accepted world's */
/*  URL replaces the address (reload = the same world). Rejected candidates  */
/*  never start; no other planet or scenario is ever substituted.            */
/*  &candidates=a,b,c (QA hook) fixes the seed list; &avoid=<n> skips a seed. */
/*  ?play=1 alone = First Bloom through the harness path above, unchanged.   */
/* ========================================================================== */
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fill=(t,m)=>String(t).replace(/\{(\w+)\}/g,(_,k)=>m[k]!==undefined?m[k]:`{${k}}`);
window.BLOOM_PLAY_LOG={mode:null, steps:[], state:"idle"}; // QA: how the world search ran (never any solution data)
function playFail(P,{title,body,reason,A,S,retry}){
  const brief=A&&S?`../index.html#/brief/${A.id}/${S.id}`:"../index.html#/planet";
  document.title="BLOOM — no world started"; document.querySelector("header h1 small").textContent="";
  document.querySelector("header .hud").style.visibility="hidden"; document.querySelector("header .controls").style.visibility="hidden";
  const prep=document.getElementById("prep"); if(prep) prep.remove();
  document.querySelector("main").innerHTML=`<div class="playfail" id="playFail" role="alert" style="grid-column:1/-1;align-self:start"><h2>${esc(title)}</h2>
    <p>${esc(body)}</p>${reason?`<p style="color:var(--dim)">${esc(reason)}</p>`:""}
    ${retry?`<button type="button" id="failRetry" data-go="${retry}">${esc(P.failure.retry)}</button>`:""}
    <button type="button" id="failChange" data-go="${brief}">${esc(P.failure.change)}</button>
    <button type="button" id="failHome" data-go="../index.html">${esc(P.actions.home)}</button></div>`;
  document.querySelectorAll("#playFail button[data-go]").forEach(b=>b.addEventListener("click",()=>{ location.href=b.dataset.go; }));
  document.getElementById("log").textContent="No world started.";
  window.BLOOM_API={ run:{ failed:true, play:true, archetypeId:A?A.id:null, scenarioId:S?S.id:null, title } };
  (document.getElementById("failRetry")||document.getElementById("failChange")).focus();
}
function playBoot(q){
  const D=BLOOM_DATA, P=D.play, aid=q.get("archetype"), scText=q.get("scenario"), seedText=q.get("seed"), cand=q.get("candidates");
  const A=(D.archetypes||[]).find(a=>a.id===aid); let S=null;
  try { S=BLOOM.pressure.resolveScenario(D.scenarios, scText); } catch(e){ S=null; }
  const seedOk=t=>/^\d{1,10}$/.test(t)&&+t<=4294967295;
  if(!A||!S||(seedText!==null&&!seedOk(seedText))||(cand!==null&&!cand.split(",").every(seedOk)))
    return playFail(P,{title:P.failure.title, body:P.failure.badLink});
  const replay=seedText!==null, avoid=q.get("avoid");
  const rand=()=>crypto.getRandomValues(new Uint32Array(1))[0];
  const seeds=replay?[+seedText]:cand!==null?cand.split(",").map(Number):BLOOM.play.pickSeeds(P.search.maxCandidates, P.search, rand, avoid!==null&&seedOk(avoid)?+avoid:null);
  const names={planet:A.name, scenario:S.name}, L=P.loading;
  // the preparation screen (covers the inert run page until the world is ready)
  document.title=`BLOOM — ${P.loading.title}`;
  const prep=document.createElement("div"); prep.className="prep"; prep.id="prep"; prep.setAttribute("role","dialog"); prep.setAttribute("aria-modal","true"); prep.setAttribute("aria-labelledby","prepTitle");
  prep.innerHTML=`<div class="box"><h2 id="prepTitle">${esc(L.title)}</h2><div class="what" id="prepWhat">${esc(A.name)} · ${esc(S.name)}</div>
    <div class="stepline" aria-live="polite"><span class="spin" aria-hidden="true"></span><span id="prepStep">${esc(L.steps.terrain)}</span></div>
    <div class="slow" id="prepSlow"></div><button type="button" id="prepCancel">${esc(L.cancel)}</button></div>`;
  document.body.appendChild(prep); document.getElementById("prepCancel").focus();
  const LOG=window.BLOOM_PLAY_LOG; LOG.state="running"; LOG.seeds=seeds.length; let cancelled=false, stop=()=>{};
  const slowT=setTimeout(()=>{ const e=document.getElementById("prepSlow"); if(e) e.textContent=L.slowNote; },4000);
  document.getElementById("prepCancel").addEventListener("click",()=>{ cancelled=true; stop(); LOG.state="cancelled"; clearTimeout(slowT);
    location.href=`../index.html#/brief/${A.id}/${S.id}`; });
  const onStep=st=>{ if(cancelled) return; LOG.steps.push({step:st.step, index:st.index});
    const e=document.getElementById("prepStep"); if(e) e.textContent=fill(L.steps[st.step]||L.title, names); };
  const args={archetypeId:A.id, scenarioId:S.id, seeds};
  // main-thread fallback (file:// pages cannot start workers): the same generator, one step per task so the screen repaints
  const searchHere=()=>new Promise((resolve,reject)=>{ LOG.mode="main";
    const it=BLOOM.play.searchWorld({archetype:A, scenario:S, seeds, config:D.config, traits:D.traits});
    const next=()=>{ if(cancelled) return; let r; try { r=it.next(); } catch(e){ return reject(e); }
      if(r.done) return resolve(r.value); onStep(r.value); setTimeout(next,30); };
    setTimeout(next,30); });
  const searchWorker=()=>new Promise((resolve,reject)=>{ let w, heard=false;
    try { w=new Worker("../resources/bloom-play-worker.js"); } catch(e){ return searchHere().then(resolve,reject); }
    LOG.mode="worker"; stop=()=>w.terminate();
    w.onmessage=e=>{ heard=true; const m=e.data;
      if(m.type==="step") onStep(m.step); else { w.terminate(); m.type==="done"?resolve(m.result):reject(new Error(m.message)); } };
    w.onerror=ev=>{ ev.preventDefault(); w.terminate(); if(!heard) searchHere().then(resolve,reject); else reject(new Error(ev.message||"world search failed")); };
    w.postMessage(args); });
  searchWorker().then(res=>{ clearTimeout(slowT); if(cancelled) return; LOG.state=res.ok?"accepted":"failed"; LOG.tried=res.tried.map(t=>({seed:t.seed, outcome:t.outcome}));
    if(!res.ok) return playFail(P,{title:P.failure.title, A, S, retry:"demo-run.html?"+BLOOM.play.runQuery({archetype:A.id, scenario:S.id}),
      body:fill(replay?P.failure.replayBody:P.failure.body, names), reason:res.status==="DISALLOWED"?res.reason:null});
    const planet=res.planet, run={kind:"procedural", play:true, planet, archetype:A, seed:res.seed, scenario:S,
      summary:{...procSummary(A, planet), scenarioId:S.id, scenario:S.name}};
    if(res.scenarioValidation) run.summary.scenarioValidation=res.scenarioValidation; // a count only — no builds, no plans
    history.replaceState(null, "", location.pathname+"?"+BLOOM.play.runQuery({archetype:A.id, seed:res.seed, scenario:S.id}));
    prep.remove(); startRun(run);
  }, err=>{ clearTimeout(slowT); LOG.state="error"; LOG.error=String(err&&err.message||err);
    playFail(P,{title:P.failure.title, body:fill(P.failure.body, names), A, S, retry:"demo-run.html?"+BLOOM.play.runQuery({archetype:A.id, scenario:S.id})}); });
}
{ const q=new URLSearchParams(location.search), play=q.get("play")==="1";
  if(play&&q.get("archetype")!==null&&window.BLOOM&&BLOOM.play&&window.BLOOM_DATA&&BLOOM_DATA.play) playBoot(q);
  else { const run=harnessRun(); if(play&&!run.failed&&run.kind!=="missing") run.play=true; startRun(run); } }
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOOM — Expedition descent (028B integration harness)</title>
<!--
  BLOOM-028B · integration harness for the Destination Survey → expedition departure. Pick a world, inspect it, press
  BEGIN EXPEDITION: the dossier recedes, the same live globe grows toward the viewer, AtmosphereTransition's DRAMATIC cloud cover
  closes, and ONLY under full cover the exact `detail.planet` the survey handed over is mounted on a development handoff target
  (its starting surface drawn by resources/planet-sphere/planet-texture.js — the authoritative tilemap, not a regenerated world)
  and the survey is disposed. Then the clouds part on the surface.

  This is NOT gameplay and NOT the root index.html integration: the handoff target is a clearly marked development surface that
  proves the visual / state seam the Main PMO will later connect to the real game.

  ES modules + module workers: serve the repository root over http, e.g.
    python3 -m http.server 8767   →   http://localhost:8767/demos/expedition-descent.html
  ?sector=<n> reproducible sector seed · &firstBloom=1 · &rm=1 | &rm=0 force reduced motion · &workers=<1…3>
  &hold=<ms>  simulate slow async work under cover (default 0) · &fail=1  make the covered work fail (the survey must come back)
  &seed=<n>   fix the cloud layout (default: a fresh random layout every departure)
-->
<link rel="stylesheet" href="../resources/destination-survey/destination-survey.css">
<style>
  html,body{margin:0; height:100%; background:#03050b}
  #survey{position:relative; width:100%; height:100vh; height:100dvh}
  /* the development handoff target: the selected world's starting surface, full bleed */
  .dest{position:fixed; inset:0; overflow:hidden; background:#03050b; color:#edf1f8; font:600 15px/1.4 ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,sans-serif}
  .dest[hidden]{display:none}
  .dest canvas{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; image-rendering:pixelated; image-rendering:crisp-edges}
  .dest::after{content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(3,5,11,.55) 100%)}
  .dest-plate{position:absolute; z-index:1; left:clamp(16px,3vw,32px); top:clamp(16px,3vw,28px); max-width:min(520px, calc(100% - 32px)); padding:14px 18px;
    border:2px dashed #ffd479; border-radius:16px 13px 17px 14px; background:rgba(14,20,36,.88)}
  .dest-plate small{display:block; font-size:12px; font-weight:800; letter-spacing:2.2px; text-transform:uppercase; color:#ffd479}
  .dest-plate h1{margin:4px 0 2px; font-size:30px; line-height:1.1}
  .dest-plate h1:focus{outline:none}
  .dest-plate p{margin:4px 0 0; color:#aab5ca; font-size:14px}
  .dest-plate code{color:#fff}
  .dest-plate button{margin-top:10px; font:800 13px inherit; font-family:inherit; letter-spacing:1px; text-transform:uppercase; color:#3a2800; background:#ffd479; border:0; border-radius:10px; padding:7px 12px; cursor:pointer}
  .dev-error{position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:20; padding:10px 14px; border:2px dashed #f48aa3; border-radius:14px;
    background:rgba(30,6,12,.94); color:#ffd0da; font:600 14px/1.35 ui-rounded,"Trebuchet MS",system-ui,sans-serif}
</style>
</head>
<body>
<main id="survey"></main>
<section class="dest" id="dest" hidden aria-labelledby="destTitle">
  <canvas id="destMap" aria-hidden="true"></canvas>
  <div class="dest-plate">
    <small>Expedition handoff target · development harness</small>
    <h1 id="destTitle" tabindex="-1"></h1>
    <p id="destMeta"></p>
    <p>The planet surface you chose, mounted under cloud cover from <code>detail.planet</code>. Gameplay is not started here.</p>
    <button type="button" id="reset">Reset (dev)</button>
  </div>
</section>
<div class="dev-error" id="devError" role="alert" hidden></div>

<script src="../content/config.js"></script>
<script src="../content/traits.js"></script>
<script src="../planets/first_bloom.js"></script>
<script src="../content/archetypes.js"></script>
<script src="../content/scenarios.js"></script>
<script src="../content/play.js"></script>
<script src="../resources/bloom-sim.js"></script>
<script src="../resources/bloom-gen.js"></script>
<script src="../resources/bloom-validate.js"></script>
<script src="../resources/bloom-witness.js"></script>
<script src="../resources/bloom-archetype.js"></script>
<script src="../resources/bloom-scenario.js"></script>
<script src="../resources/bloom-play.js"></script>

<script type="module">
import { DestinationSurvey } from "../resources/destination-survey/destination-survey.js";
import { drawPlanetTexture } from "../resources/planet-sphere/planet-texture.js";
import { planetFingerprint } from "../resources/destination-survey/survey-data.js";

const q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const DEV = window.DESCENT_DEV = { ready: false, errors: [], hooks: [], handoffs: [], results: [], survey: null };
addEventListener("error", e => DEV.errors.push(String(e.message || e)));
addEventListener("unhandledrejection", e => DEV.errors.push(String(e.reason && e.reason.message || e.reason)));
const rm = q.get("rm") === "1" ? true : q.get("rm") === "0" ? false : null, hold = +(q.get("hold") || 0), fail = q.get("fail") === "1";

/** Mount the development handoff target from the handed-over planet object (no generator, no seed). */
function mountDestination(detail) {
  const p = detail.planet, c = detail.candidate;
  drawPlanetTexture($("destMap"), p, { render: detail.render || null });
  $("destTitle").textContent = c.name;
  $("destMeta").innerHTML = `${c.authored ? "Authored world" : `${c.archetypeId} · World Seed ${c.seed}`} · planet <code>${planetFingerprint(p)}</code>`;
  $("dest").hidden = false;
}

const survey = DEV.survey = new DestinationSurvey($("survey"), {
  sectorSeed: q.has("sector") ? +q.get("sector") : null, firstBloom: q.get("firstBloom") === "1", reducedMotion: rm, workers: q.has("workers") ? +q.get("workers") : null,
  onBeginExpedition(d) { DEV.hooks.push({ key: d.candidate.key, at: performance.now(), detail: d }); },
  descent: {
    seed: q.has("seed") ? +q.get("seed") : null,
    async onCovered(detail, info) {
      const rec = { at: performance.now(), concealed: info.concealed, reducedMotion: info.reducedMotion, destHiddenAtCover: $("dest").hidden,
        veil: +getComputedStyle(document.querySelector(".atx-veil")).opacity, planet: detail.planet };
      DEV.handoffs.push(rec);
      if (hold) await new Promise(r => setTimeout(r, hold));            // simulated async preparation under cover
      if (fail) throw new Error("dev: covered work failed (fail=1)");
      detail.survey.dispose();                                          // the outgoing screen goes while hidden
      rec.surveyDisposedAt = performance.now();
      mountDestination(detail);
      rec.mountedAt = performance.now();
    },
    onError(err) { DEV.results.push({ error: err.message }); const e = $("devError"); e.textContent = `Descent failed: ${err.message} — back on the survey.`; e.hidden = false; },
  },
});
survey.root.addEventListener("bloom:begin-expedition", e => {
  e.detail.descent.then(r => { DEV.results.push({ ok: true, transition: r.transition }); $("destTitle").focus({ preventScroll: true }); }, () => {});
});
$("reset").onclick = () => location.reload();
survey.ready.then(() => { DEV.ready = true; }, err => DEV.errors.push("survey: " + (err && err.message || err)));
</script>
</body>
</html>

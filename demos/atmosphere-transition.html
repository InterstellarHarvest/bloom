<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOOM — AtmosphereTransition (028B technical demo)</title>
<!--
  BLOOM-028B · standalone technical demo of the reusable AtmosphereTransition (resources/atmosphere-transition/), independent
  of the Destination Survey. Two plain dev screens (A / B) are swapped underneath the overlay in its covered callback.
  Not product UI. Exercises: DRAMATIC, SUBDUED (and SUBDUED with full conceal), reduced motion (system / forced on / off),
  an immediate or artificially delayed covered callback, and a failing callback (the overlay must still clear).

  ES modules: serve the repository root over http, e.g.
    python3 -m http.server 8767   →   http://localhost:8767/demos/atmosphere-transition.html
  ?rm=1 | ?rm=0   force reduced motion on / off (default: follow prefers-reduced-motion)
  ?seed=<n>       fix the cloud layout (default: a fresh random layout every run)
-->
<style>
  :root{--font:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif}
  html,body{margin:0; height:100%; background:#03050b; color:#edf1f8; font:600 15px/1.4 var(--font)}
  .screen{position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr; padding:24px clamp(16px,4vw,48px) 20px; box-sizing:border-box}
  .screen[hidden]{display:none}
  #A{background:radial-gradient(120% 90% at 30% 0%, #10314a 0%, #0a1729 55%, #03050b 100%)}
  #B{background:radial-gradient(120% 90% at 70% 0%, #4a3410 0%, #2a1a08 55%, #0b0703 100%)}
  .screen h1{margin:0; font-size:clamp(28px,5vw,56px); letter-spacing:1px}
  .screen h1 small{display:block; font-size:13px; letter-spacing:2.4px; text-transform:uppercase; color:#8fa0bd}
  .tiles{display:grid; grid-template-columns:repeat(6,1fr); gap:12px; align-content:center}
  .tiles i{display:block; aspect-ratio:1; border-radius:18px 14px 20px 14px}
  #A .tiles i{background:#1f6f8f} #A .tiles i:nth-child(3n){background:#3fb0a0} #A .tiles i:nth-child(4n){background:#86d98f}
  /* the incoming screen carries a marker colour (#ff00aa) that QA looks for while the overlay should be concealing */
  #B .tiles i{background:#c9861d} #B .tiles i:nth-child(3n){background:#f2c45a} #B .tiles i:nth-child(5n){background:#ff00aa}
  .panel{position:fixed; z-index:5; right:16px; bottom:16px; width:min(380px, calc(100% - 32px)); box-sizing:border-box; padding:14px 16px;
    border:2px solid #27324d; border-radius:16px 13px 17px 14px; background:rgba(14,20,36,.92)}
  .panel h2{margin:0 0 8px; font-size:12px; letter-spacing:2.4px; text-transform:uppercase; color:#aab5ca}
  .row{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0}
  .panel button{font:800 13px var(--font); letter-spacing:1px; text-transform:uppercase; color:#fff; background:#2b6ea8; border:2px solid #4f9fe0; border-radius:12px; padding:8px 12px; cursor:pointer}
  .panel button.alt{background:#3f9d4b; border-color:#62c06d}
  .panel label{font-size:13px; color:#aab5ca}
  .panel select{font:inherit; background:#141c31; color:#edf1f8; border:2px solid #3a4766; border-radius:10px; padding:4px 6px}
  #log{margin:8px 0 0; max-height:150px; overflow:auto; font:12px/1.35 ui-monospace,Menlo,monospace; color:#cdd6e6; white-space:pre-wrap}
  .warn{color:#f48aa3}
</style>
</head>
<body>
<section class="screen" id="A"><h1><small>Dev screen</small>Screen A</h1><div class="tiles"></div></section>
<section class="screen" id="B" hidden><h1><small>Dev screen</small>Screen B</h1><div class="tiles"></div></section>

<aside class="panel" aria-label="Transition controls">
  <h2>AtmosphereTransition · 028B dev</h2>
  <div class="row">
    <button type="button" data-run="dramatic">Dramatic</button>
    <button type="button" data-run="subdued" class="alt">Subdued</button>
    <button type="button" data-run="subdued-full" class="alt">Subdued · full</button>
  </div>
  <div class="row">
    <label>Covered work <select id="hold"><option value="0">immediate</option><option value="600">600 ms</option><option value="2500">2.5 s</option></select></label>
    <label>Motion <select id="motion"><option value="">system</option><option value="1">reduced</option><option value="0">full</option></select></label>
    <label><input type="checkbox" id="fail"> callback fails</label>
  </div>
  <pre id="log" aria-live="polite"></pre>
</aside>

<script type="module">
import { AtmosphereTransition } from "../resources/atmosphere-transition/atmosphere-transition.js";

const $ = id => document.getElementById(id), q = new URLSearchParams(location.search);
for (const s of document.querySelectorAll(".tiles")) s.innerHTML = "<i></i>".repeat(18);
if (q.get("rm") === "1" || q.get("rm") === "0") $("motion").value = q.get("rm");
const DEV = window.ATX_DEV = { runs: [], errors: [], atx: new AtmosphereTransition(), showing: "A", run: null };
addEventListener("error", e => DEV.errors.push(String(e.message || e)));
addEventListener("unhandledrejection", e => DEV.errors.push(String(e.reason && e.reason.message || e.reason)));
const log = (t, cls = "") => { const el = $("log"); el.insertAdjacentHTML("afterbegin", `<span class="${cls}">${t}</span>\n`); };

/** One demo run: swap A ↔ B underneath while covered. opts = { preset, conceal, holdMs, fail, reducedMotion } (QA calls this directly). */
DEV.run = async ({ preset = "dramatic", conceal = null, holdMs = 0, fail = false, reducedMotion = null, seed = q.has("seed") ? +q.get("seed") : null } = {}) => {
  const rec = { preset, conceal, holdMs, fail, reducedMotion, seed, phases: [], swapAt: null };
  DEV.runs.push(rec);
  const t0 = performance.now();
  try {
    rec.result = await DEV.atx.run({ preset, conceal, reducedMotion, seed,
      onPhase: p => rec.phases.push([p, Math.round(performance.now() - t0)]),
      async onCovered(info) {
        rec.covered = { at: Math.round(performance.now() - t0), concealed: info.concealed, reducedMotion: info.reducedMotion,
          veil: +getComputedStyle(document.querySelector(".atx-veil")).opacity };
        if (holdMs) await new Promise(r => setTimeout(r, holdMs));        // simulated async work while covered
        if (fail) throw new Error("demo: covered work failed");
        const next = DEV.showing === "A" ? "B" : "A";                       // the swap underneath
        $(DEV.showing).hidden = true; $(next).hidden = false; DEV.showing = next;
        rec.swapAt = Math.round(performance.now() - t0);
      } });
    log(`${preset}${conceal ? "/" + conceal : ""}${rec.result.reducedMotion ? " (reduced)" : ""}: covered @${rec.result.times.covered} · reveal @${rec.result.times.revealStart} · end @${rec.result.totalMs} ms · seed ${rec.result.seed} → screen ${DEV.showing}`);
  } catch (err) {
    rec.error = { name: err.name, message: err.message };
    log(`${preset}: ${err.name}: ${err.message} — overlay cleared, still on screen ${DEV.showing}`, "warn");
  }
  rec.overlayLeft = !!document.querySelector(".atx");
  return rec;
};

document.querySelector(".panel").addEventListener("click", e => {
  const b = e.target.closest("[data-run]"); if (!b) return;
  const m = $("motion").value, [preset, full] = b.dataset.run.split("-");
  DEV.run({ preset, conceal: full ? "full" : null, holdMs: +$("hold").value, fail: $("fail").checked, reducedMotion: m === "" ? null : m === "1" });
});
DEV.atx.prepare().then(() => { DEV.ready = true; }); // draw the cloud bitmaps up front (a real screen would do this when it appears)
</script>
</body>
</html>
